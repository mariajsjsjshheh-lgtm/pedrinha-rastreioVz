<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MARCAÇÃO QUE SEGUE O COPO ✅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            touch-action: none;
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ✅ A MARCAÇÃO IGUAL DA FOTO — QUADRO EM VOLTA + PONTOS */
        .marcacao {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            display: none;
            transition: left 0.05s linear, top 0.05s linear;
        }

        .quadro {
            position: relative;
            width: 90px;
            height: 120px;
        }

        .linha-esq {
            position: absolute;
            left: 12px; top: 0;
            width: 3px; height: 100%;
            background: linear-gradient(to bottom, #4af, #28f);
            border-radius: 3px;
        }

        .linha-dir {
            position: absolute;
            right: 12px; top: 0;
            width: 3px; height: 100%;
            background: linear-gradient(to bottom, #4af, #28f);
            border-radius: 3px;
        }

        .ponto-cima {
            position: absolute;
            left: 6px; top: -6px;
            width: 16px; height: 16px;
            background: #4af;
            border-radius: 50%;
            box-shadow: 0 0 10px #4af;
        }

        .ponto-baixo {
            position: absolute;
            right: 6px; bottom: -6px;
            width: 16px; height: 16px;
            background: #4af;
            border-radius: 50%;
            box-shadow: 0 0 10px #4af;
        }

        .etiqueta {
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            background: #28f;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 0 8px rgba(34,136,255,0.5);
        }

        .aviso {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 200;
            border: 2px solid #4af;
            text-align: center;
        }

        .botao {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #28f;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            z-index: 200;
        }
        .botao:active { transform: scale(0.96); }
        .botao.escondido { display: none; }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <!-- ✅ MARCAÇÃO IGUAL DA FOTO -->
    <div class="marcacao" id="marcador">
        <div class="quadro">
            <div class="ponto-cima"></div>
            <div class="linha-esq"></div>
            <div class="linha-dir"></div>
            <div class="ponto-baixo"></div>
            <div class="etiqueta">🔒 SEGUINDO</div>
        </div>
    </div>

    <div class="aviso" id="aviso">
        👆 TOQUE NO COPO → A MARCAÇÃO GRUDA E VAI JUNTO!
    </div>

    <button class="botao" id="btnNovo">🔄 OUTRO COPO</button>

<script>
// ==============================================================
// IGUAL DA FOTO — SIMPLES, GRUDA, SEGUE PRA ONDE FOR
// ==============================================================
// ✅ Toque no copo → aparece a marcação azul em volta
// ✅ Mexe o copo → a marcação vai junto NA HORA
// ✅ Para o copo → marcação para junto
// ✅ Embaralha → continua no MESMO copo
// ✅ Fácil, direto, sem complicação
// ==============================================================

const cam = document.getElementById('cam');
const marcador = document.getElementById('marcador');
const aviso = document.getElementById('aviso');
const btnNovo = document.getElementById('btnNovo');

let canvas, ctx;

const alvo = {
    ativo: false,
    cor: { r: 0, g: 0, b: 0, tol: 55 },
    x: 0, y: 0,
    imgX: 0, imgY: 0,
    raioBusca: 120,
    rapidez: 0.5, // Quanto mais alto = mais rápido acompanha
    perdidos: 0
};

// Liga câmera
navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: 1280, height: 720 }
}).then(fluxo => {
    cam.srcObject = fluxo;
    cam.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
    };
}).catch(() => alert('Permita a câmera! 📷'));

// Toque = marca o copo
document.addEventListener('touchstart', marcar, { passive: false });
document.addEventListener('mousedown', marcar);

function marcar(e) {
    e.preventDefault();
    if (!canvas || alvo.ativo) return;

    let tx, ty;
    if (e.touches) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
    else { tx = e.clientX; ty = e.clientY; }

    const rect = cam.getBoundingClientRect();
    const ix = (tx / rect.width) * canvas.width;
    const iy = (ty / rect.height) * canvas.height;

    // Pega a cor do copo tocado
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let r=0, g=0, b=0, q=0;
    for (let dy = -30; dy <= 30; dy += 2) {
        for (let dx = -30; dx <= 30; dx += 2) {
            const px = Math.round(ix + dx);
            const py = Math.round(iy + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > 30) continue;
            const i = (py * canvas.width + px) * 4;
            r += dados[i]; g += dados[i+1]; b += dados[i+2]; q++;
        }
    }

    alvo.cor.r = Math.round(r/q);
    alvo.cor.g = Math.round(g/q);
    alvo.cor.b = Math.round(b/q);

    alvo.x = tx;
    alvo.y = ty;
    alvo.imgX = ix;
    alvo.imgY = iy;
    alvo.perdidos = 0;
    alvo.ativo = true;

    // Mostra marcação
    marcador.style.display = 'block';
    posicao(tx, ty);
    aviso.textContent = '✅ MARCADO! Mova o copo que vai junto!';
    btnNovo.classList.remove('escondido');

    seguir();
}

// SEGUE O COPO O TEMPO TODO
function seguir() {
    if (!alvo.ativo || !ctx) {
        requestAnimationFrame(seguir);
        return;
    }

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const rect = cam.getBoundingClientRect();

    // Busca perto de onde o copo estava
    let somaX = 0, somaY = 0, q = 0;
    const raio = alvo.raioBusca;

    for (let dy = -raio; dy <= raio; dy += 2) {
        for (let dx = -raio; dx <= raio; dx += 2) {
            const px = Math.round(alvo.imgX + dx);
            const py = Math.round(alvo.imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > raio) continue;

            const i = (py * canvas.width + px) * 4;
            const r = dados[i], g = dados[i+1], b = dados[i+2];

            const dr = Math.abs(r - alvo.cor.r);
            const dg = Math.abs(g - alvo.cor.g);
            const db = Math.abs(b - alvo.cor.b);

            if (dr < alvo.cor.tol && dg < alvo.cor.tol && db < alvo.cor.tol) {
                somaX += px;
                somaY += py;
                q++;
            }
        }
    }

    if (q >= 8) {
        // Achou — atualiza posição
        const novoIX = somaX / q;
        const novoIY = somaY / q;

        const novoX = (novoIX / canvas.width) * rect.width;
        const novoY = (novoIY / canvas.height) * rect.height;

        // Atualiza com velocidade igual do copo
        alvo.x = alvo.x * (1 - alvo.rapidez) + novoX * alvo.rapidez;
        alvo.y = alvo.y * (1 - alvo.rapidez) + novoY * alvo.rapidez;
        alvo.imgX = novoIX;
        alvo.imgY = novoIY;
        alvo.perdidos = 0;

        // Coloca a marcação em volta do copo
        posicao(alvo.x, alvo.y);
    } else {
        alvo.perdidos++;
        // Não some, continua buscando
    }

    requestAnimationFrame(seguir);
}

// Centraliza a marcação em volta do copo
function posicao(centroX, centroY) {
    // -45 = metade da largura → centralizado
    // -60 = metade da altura → em volta do copo
    marcador.style.left = (centroX - 45) + 'px';
    marcador.style.top = (centroY - 60) + 'px';
}

// Trocar de copo
btnNovo.addEventListener('click', () => {
    alvo.ativo = false;
    marcador.style.display = 'none';
    btnNovo.classList.add('escondido');
    aviso.textContent = '👆 TOQUE NO NOVO COPO PARA MARCAR';
});
</script>
</body>
</html>
