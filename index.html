<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTREADOR PERFEITO — AQUII 💎🔒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        /* MARCADOR — MENOR, FIXO EM CIMA DA PEDRINHA, NÃO SE MEXE SEM MOTIVO */
        .marcador {
            position: absolute;
            width: 50px; height: 50px; /* MENOR */
            border: 3px solid #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffff00, 0 0 35px #ffd00099;
            pointer-events: none;
            display: none;
            z-index: 10;
            transition: left 0.005s linear, top 0.005s linear; /* MUITO RÁPIDO E FIEL */
            animation: pulso 0.5s infinite alternate;
        }
        
        .etiqueta {
            position: absolute;
            background: linear-gradient(135deg, #ffff00, #ffd000);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.5);
            pointer-events: none;
            display: none;
            z-index: 11;
            transition: left 0.005s linear, top 0.005s linear;
            white-space: nowrap;
        }
        
        .nao-e {
            position: absolute;
            background: #ff3333;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            z-index: 9;
            white-space: nowrap;
        }
        
        .cadeado {
            position: fixed;
            top: 55px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #ffff00;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 20;
            display: none;
        }
        
        .nota {
            position: fixed;
            top: 95px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 20;
            display: none;
        }
        
        .botoes {
            position: fixed;
            bottom: 35px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex; gap: 12px;
        }
        
        button {
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        #btnLocalizar { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        #btnParar { background: linear-gradient(135deg, #ff3333, #bb0000); color: #fff; display: none; }
        
        .status {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 20;
            text-align: center;
        }
        
        @keyframes pulso {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="marcador" id="marcador"></div>
    <div class="etiqueta" id="etiqueta">AQUII 💎</div>
    <div class="nao-e" id="naoE">ESSA NÃO ❌</div>
    <div class="cadeado" id="cadeado">🔒 BLOQUEADO — SÓ MINHA PEDRINHA</div>
    <div class="nota" id="nota">Q: 1000/1000 — PRECISÃO MÁXIMA</div>
    
    <div class="status" id="status">📷 Permita a câmera → clique em MARCAR e depois NA SUA PEDRINHA!</div>
    
    <div class="botoes">
        <button id="btnLocalizar">🎯 MARCAR MINHA PEDRINHA</button>
        <button id="btnParar">🛑 PARAR</button>
    </div>

<script>
const cam = document.getElementById('cam');
const marcador = document.getElementById('marcador');
const etiqueta = document.getElementById('etiqueta');
const naoE = document.getElementById('naoE');
const cadeado = document.getElementById('cadeado');
const nota = document.getElementById('nota');
const btnLocalizar = document.getElementById('btnLocalizar');
const btnParar = document.getElementById('btnParar');
const status = document.getElementById('status');

let rastreando = false;
let alvo = null;
let corRef = null;
let tolerancia = 22; // MUITO RÍGIDO — NÃO CONFUNDE NADA
let ctx = null, quadro = null;
let ultimoPontoVisivel = null;
let tempoEscondido = 0;

// LIGA CÂMERA
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 854 },
        height: { ideal: 480 },
        frameRate: { ideal: 60 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        status.textContent = '✅ PRONTO! Clique em MARCAR e depois NA SUA PEDRINHA!';
    };
}).catch(() => {
    status.textContent = '❌ Permita a câmera!';
    alert('Dê permissão à câmera! 📷');
});

// CLICA PRA MARCAR
btnLocalizar.onclick = () => {
    rastreando = true;
    btnLocalizar.style.display = 'none';
    btnParar.style.display = 'block';
    status.textContent = '👆 CLIQUE EXATAMENTE NO CENTRO DA PEDRINHA AGORA!';
};

// === MARCAÇÃO EXATA — PEGA A ASSINATURA ÚNICA DELA ===
cam.onclick = (e) => {
    if (!rastreando || !ctx) return;
    
    const rect = cam.getBoundingClientRect();
    const escX = quadro.width / rect.width;
    const escY = quadro.height / rect.height;
    
    const x = (e.clientX - rect.left) * escX;
    const y = (e.clientY - rect.top) * escY;
    
    // PEGA A COR EXATA DE VÁRIOS PONTOS → ASSINATURA ÚNICA
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    let r=0, g=0, b=0, n=0;
    for(let dy=-5; dy<=5; dy+=2) {
        for(let dx=-5; dx<=5; dx+=2) {
            const p = ctx.getImageData((x+dx)|0, (y+dy)|0, 1, 1).data;
            r += p[0]; g += p[1]; b += p[2]; n++;
        }
    }
    corRef = { r: r/n, g: g/n, b: b/n };
    
    // PONTO INICIAL — TRAVADO
    alvo = { 
        x: x, 
        y: y, 
        vx: 0, 
        vy: 0,
        confirmado: true
    };
    ultimoPontoVisivel = { x: x, y: y };
    tempoEscondido = 0;
    
    // TRAVA — NÃO DEIXA MUDAR
    cam.onclick = null;
    
    // MOSTRA CADEADO E NOTA
    cadeado.style.display = 'block';
    nota.style.display = 'block';
    status.textContent = '🔒 PEDRINHA MARCADA — SÓ ELA PARA SEMPRE! NENHUMA OUTRA!';
};

btnParar.onclick = () => {
    rastreando = false;
    marcador.style.display = 'none';
    etiqueta.style.display = 'none';
    naoE.style.display = 'none';
    cadeado.style.display = 'none';
    nota.style.display = 'none';
    btnLocalizar.style.display = 'block';
    btnParar.style.display = 'none';
    status.textContent = '⏹️ Parado — marque de novo';
    alvo = corRef = null;
    ultimoPontoVisivel = null;
    tempoEscondido = 0;
};

// === MOSTRA MARCADOR EM CIMA DA PEDRINHA ===
function mostrar(x, y) {
    const rect = cam.getBoundingClientRect();
    const tx = x / quadro.width * rect.width;
    const ty = y / quadro.height * rect.height;
    
    // MARCADOR EM CIMA — MENOR
    marcador.style.display = 'block';
    marcador.style.left = (tx - 25) + 'px';
    marcador.style.top = (ty - 25) + 'px';
    
    // ETIQUETA "AQUII" EM CIMA DO MARCADOR
    etiqueta.style.display = 'block';
    etiqueta.style.left = (tx - 35) + 'px';
    etiqueta.style.top = (ty - 75) + 'px';
}

// === MOSTRA "ESSA NÃO" NAS OUTRAS ===
function mostrarNaoE(x, y) {
    const rect = cam.getBoundingClientRect();
    const tx = x / quadro.width * rect.width;
    const ty = y / quadro.height * rect.height;
    
    naoE.style.display = 'block';
    naoE.style.left = (tx - 30) + 'px';
    naoE.style.top = (ty - 50) + 'px';
    
    // Desaparece rápido
    setTimeout(() => { naoE.style.display = 'none'; }, 600);
}

// === VERIFICA: É A PEDRINHA CERTA? ===
function ehPedrinha(r, g, b) {
    if (!corRef) return false;
    return Math.abs(r - corRef.r) < tolerancia &&
           Math.abs(g - corRef.g) < tolerancia &&
           Math.abs(b - corRef.b) < tolerancia;
}

// === O CÉREBRO — PRECISO, SEM ADIVINHAÇÃO, SEM FUGA ===
function rastrear() {
    if (!rastreando || !alvo || !corRef || !ctx) {
        requestAnimationFrame(rastrear);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // ÁREA DE BUSCA: NÃO EXPANDE DEMAIS → NÃO VAI PRA OUTROS OBJETOS
    const raioBusca = 70; // FIXO — NÃO CRESCE, NÃO VAGA
    
    let somaX = 0, somaY = 0, cont = 0;
    let encontrouOutro = false;
    let posOutro = { x: 0, y: 0 };
    
    const minX = Math.max(0, alvo.x - raioBusca) | 0;
    const maxX = Math.min(quadro.width, alvo.x + raioBusca) | 0;
    const minY = Math.max(0, alvo.y - raioBusca) | 0;
    const maxY = Math.min(quadro.height, alvo.y + raioBusca) | 0;
    
    // BUSCA SÓ DENTRO DA ÁREA PRÓXIMA — NÃO VAGA
    for (let y = minY; y < maxY; y += 2) {
        for (let x = minX; x < maxX; x += 2) {
            const i = (y * quadro.width + x) * 4;
            const r = dados[i], g = dados[i+1], b = dados[i+2];
            
            if (ehPedrinha(r, g, b)) {
                somaX += x;
                somaY += y;
                cont++;
            }
        }
    }
    
    // PROCURA FORA DA ÁREA = OUTRA PEDRINHA → IGNORA E MARCA "ESSA NÃO"
    if (cont === 0) {
        // Busca rápida geral só pra descartar
        const raioAmplo = 200;
        const mx = Math.max(0, alvo.x - raioAmplo) | 0;
        const Mx = Math.min(quadro.width, alvo.x + raioAmplo) | 0;
        const my = Math.max(0, alvo.y - raioAmplo) | 0;
        const My = Math.min(quadro.height, alvo.y + raioAmplo) | 0;
        
        let ox = 0, oy = 0, oc = 0;
        for (let y = my; y < My; y += 4) {
            for (let x = mx; x < Mx; x += 4) {
                const i = (y * quadro.width + x) * 4;
                if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                    ox += x; oy += y; oc++;
                }
            }
        }
        if (oc > 0) {
            posOutro = { x: ox/oc, y: oy/oc };
            // Se está longe = OUTRA → MARCA "ESSA NÃO"
            const dist = Math.hypot(posOutro.x - alvo.x, posOutro.y - alvo.y);
            if (dist > raioBusca * 1.3) {
                mostrarNaoE(posOutro.x, posOutro.y);
                encontrouOutro = true;
            }
        }
    }
    
    // === DECISÃO: ENCONTROU A MINHA PEDRINHA? ===
    if (cont >= 2) {
        // SIM! ENCONTROU — ATUALIZA DIRETO, SEM DÚVIDA
        const novoX = somaX / cont;
        const novoY = somaY / cont;
        
        // CORRIGE MOVIMENTO RÁPIDO MAS NÃO VAGA
        alvo.vx = (novoX - alvo.x) * 0.6;
        alvo.vy = (novoY - alvo.y) * 0.6;
        
        alvo.x = alvo.x + (novoX - alvo.x) * 0.85;
        alvo.y = alvo.y + (novoY - alvo.y) * 0.85;
        
        ultimoPontoVisivel = { x: alvo.x, y: alvo.y };
        tempoEscondido = 0;
        status.textContent = '✅ AQUII — PEDRINHA LOCALIZADA!';
        
    } else {
        // NÃO VIU → NÃO ADIVINHA! FICA ONDE A DEIXOU
        tempoEscondido++;
        
        if (tempoEscondido < 90) {
            // Nos primeiros momentos: segue a direção do movimento MAS NÃO SAIO PROCURANDO
            alvo.x += alvo.vx * 0.9;
            alvo.y += alvo.vy * 0.9;
            
            // NÃO SAI DA TELA
            if (alvo.x < 10) alvo.x = 10;
            if (alvo.x > quadro.width - 10) alvo.x = quadro.width - 10;
            if (alvo.y < 10) alvo.y = 10;
            if (alvo.y > quadro.height - 10) alvo.y = quadro.height - 10;
            
            // NÃO DEIXA SUBIR SOZINHO — CORRIGE
            if (ultimoPontoVisivel && alvo.y < ultimoPontoVisivel.y - 15) {
                alvo.y += 0.5; // Volta devagar pra altura correta
            }
            
            status.textContent = '👁️ Escondida — mantendo posição...';
        } else {
            // Muito tempo escondida → VOLTA AO ÚLTIMO LOCAL VISTO
            alvo.x += (ultimoPontoVisivel.x - alvo.x) * 0.05;
            alvo.y += (ultimoPontoVisivel.y - alvo.y) * 0.05;
            alvo.vx *= 0.92;
            alvo.vy *= 0.92;
            status.textContent = '🔄 Voltando ao último local...';
        }
    }
    
    mostrar(alvo.x, alvo.y);
    requestAnimationFrame(rastrear);
}

rastrear();
</script>
</body>
</html>
