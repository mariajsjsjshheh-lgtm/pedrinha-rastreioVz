<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRACKER 3 COPOS — VERSÃO FORTE 🧠💎</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { overflow: hidden; background: #000; height: 100vh; touch-action: none; }

    video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    .cobertura {
        position: absolute;
        pointer-events: none;
        z-index: 50;
        display: none;
        border-radius: 8px;
        opacity: 0.92;
        box-shadow: 0 0 25px currentColor;
        transition: left 0.03s linear, top 0.03s linear, width 0.03s linear, height 0.03s linear;
    }

    .roxo { background: #9933ff; color: #9933ff; }
    .preto { background: #111111; color: #444444; border: 3px solid #777; }
    .amarelo { background: #ffcc00; color: #ffcc00; }

    .etiqueta {
        position: absolute;
        top: -24px; left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 12px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 12px;
        white-space: nowrap;
    }
    .roxo .etiqueta { background: #9933ff; }
    .preto .etiqueta { background: #444; }
    .amarelo .etiqueta { background: #ffcc00; color: #000; }

    .aviso {
        position: fixed;
        top: 12px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.88);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        z-index: 200;
        border: 2px solid #9933ff;
        text-align: center;
        max-width: 95%;
    }

    .botoes {
        position: fixed;
        bottom: 25px; left: 50%;
        transform: translateX(-50%);
        display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        z-index: 200;
    }

    button {
        padding: 12px 20px;
        font-size: 13px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
    }
    button:active { transform: scale(0.96); }

    #btnRoxo { background: #9933ff; color: white; }
    #btnPreto { background: #333; color: white; border: 2px solid #666; }
    #btnAmarelo { background: #ffcc00; color: #000; }
    #btnReiniciar { background: #009688; color: white; display: none; }
</style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <div class="cobertura roxo" id="cRoxo">
        <div class="etiqueta">🟣 ROXO — 1º COPO</div>
    </div>
    <div class="cobertura preto" id="cPreto">
        <div class="etiqueta">⚫ PRETO — 2º COPO</div>
    </div>
    <div class="cobertura amarelo" id="cAmarelo">
        <div class="etiqueta">🟡 AMARELO — 3º COPO</div>
    </div>

    <div class="aviso" id="aviso">
        👆 TOQUE NO 1º COPO → ROXO APARECE • DEPOIS 2º → PRETO • DEPOIS 3º → AMARELO
    </div>

    <div class="botoes">
        <button id="btnRoxo">🟣 1º ROXO</button>
        <button id="btnPreto" disabled>⚫ 2º PRETO</button>
        <button id="btnAmarelo" disabled>🟡 3º AMARELO</button>
        <button id="btnReiniciar">🔄 REINICIAR TUDO</button>
    </div>

<script>
const cam = document.getElementById('cam');
const cRoxo = document.getElementById('cRoxo');
const cPreto = document.getElementById('cPreto');
const cAmarelo = document.getElementById('cAmarelo');
const aviso = document.getElementById('aviso');
const btnRoxo = document.getElementById('btnRoxo');
const btnPreto = document.getElementById('btnPreto');
const btnAmarelo = document.getElementById('btnAmarelo');
const btnReiniciar = document.getElementById('btnReiniciar');

let canvas, ctx;

const copos = {
    roxo: {
        marcado: false,
        corRef: { r: 0, g: 0, b: 0, tol: 38 },
        x: 0, y: 0,
        w: 85, h: 110,
        imgX: 0, imgY: 0,
        ultX: 0, ultY: 0,
        velocX: 0, velocY: 0,
        raioBusca: 100,
        resp: 0.55,
        perdidos: 0,
        maxPerdidos: 320
    },
    preto: {
        marcado: false,
        corRef: { r: 0, g: 0, b: 0, tol: 35 },
        x: 0, y: 0,
        w: 85, h: 110,
        imgX: 0, imgY: 0,
        ultX: 0, ultY: 0,
        velocX: 0, velocY: 0,
        raioBusca: 100,
        resp: 0.55,
        perdidos: 0,
        maxPerdidos: 320
    },
    amarelo: {
        marcado: false,
        corRef: { r: 0, g: 0, b: 0, tol: 38 },
        x: 0, y: 0,
        w: 85, h: 110,
        imgX: 0, imgY: 0,
        ultX: 0, ultY: 0,
        velocX: 0, velocY: 0,
        raioBusca: 100,
        resp: 0.55,
        perdidos: 0,
        maxPerdidos: 320
    }
};

let ordem = [];
let indiceAtual = 0;
const nomes = ['roxo', 'preto', 'amarelo'];
const elementos = { roxo: cRoxo, preto: cPreto, amarelo: cAmarelo };

navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: 1280, height: 720, frameRate: 30 }
}).then(fluxo => {
    cam.srcObject = fluxo;
    cam.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
        aviso.innerHTML = '✅ Câmera pronta — Toque no 1º copo (ROXO)';
    };
}).catch(() => alert('Permita o acesso à câmera! 📷'));

function marcarAtual(e) {
    e.preventDefault();
    if (!canvas || indiceAtual >= 3) return;

    const nome = nomes[indiceAtual];
    const copo = copos[nome];
    if (copo.marcado) return;

    let tx, ty;
    if (e.touches) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
    else { tx = e.clientX; ty = e.clientY; }

    const rect = cam.getBoundingClientRect();
    const imgX = (tx / rect.width) * canvas.width;
    const imgY = (ty / rect.height) * canvas.height;

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let r = 0, g = 0, b = 0, q = 0;

    for (let dy = -40; dy <= 40; dy += 2) {
        for (let dx = -40; dx <= 40; dx += 2) {
            const px = Math.round(imgX + dx);
            const py = Math.round(imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > 40) continue;

            const i = (py * canvas.width + px) * 4;
            r += dados[i];
            g += dados[i + 1];
            b += dados[i + 2];
            q++;
        }
    }

    copo.corRef.r = Math.round(r / q);
    copo.corRef.g = Math.round(g / q);
    copo.corRef.b = Math.round(b / q);

    copo.x = tx;
    copo.y = ty;
    copo.ultX = tx;
    copo.ultY = ty;
    copo.imgX = imgX;
    copo.imgY = imgY;
    copo.perdidos = 0;
    copo.marcado = true;

    const el = elementos[nome];
    el.style.display = 'block';
    posicionar(el, copo);

    ordem.push(nome);
    indiceAtual++;

    if (indiceAtual === 1) {
        btnPreto.disabled = false;
        aviso.innerHTML = '🟣 ROXO MARCADO ✅ → Toque no 2º copo (PRETO)';
    } else if (indiceAtual === 2) {
        btnAmarelo.disabled = false;
        aviso.innerHTML = '⚫ PRETO MARCADO ✅ → Toque no 3º copo (AMARELO)';
    } else if (indiceAtual === 3) {
        aviso.innerHTML = '✅ TODOS MARCADOS! EMBARALHE OS COPOS — CADA COR SEGUE O SEU!';
        btnRoxo.disabled = btnPreto.disabled = btnAmarelo.disabled = true;
        btnReiniciar.style.display = 'block';
        rastrearTudo();
    }
}

function rastrearTudo() {
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const rect = cam.getBoundingClientRect();

    for (const nome of nomes) {
        const copo = copos[nome];
        if (!copo.marcado) continue;

        const centroX = copo.imgX + copo.velocX * 0.5;
        const centroY = copo.imgY + copo.velocY * 0.5;
        const raio = copo.raioBusca;

        let somaX = 0, somaY = 0, q = 0;

        for (let dy = -raio; dy <= raio; dy += 2) {
            for (let dx = -raio; dx <= raio; dx += 2) {
                const px = Math.round(centroX + dx);
                const py = Math.round(centroY + dy);
                if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
                if (Math.hypot(dx, dy) > raio) continue;

                const i = (py * canvas.width + px) * 4;
                const r = dados[i], g = dados[i + 1], b = dados[i + 2];

                const dr = Math.abs(r - copo.corRef.r);
                const dg = Math.abs(g - copo.corRef.g);
                const db = Math.abs(b - copo.corRef.b);

                if (dr < copo.corRef.tol && dg < copo.corRef.tol && db < copo.corRef.tol) {
                    somaX += px;
                    somaY += py;
                    q++;
                }
            }
        }

        if (q >= 12) {
            const novoImgX = somaX / q;
            const novoImgY = somaY / q;

            const deslX = novoImgX - copo.imgX;
            const deslY = novoImgY - copo.imgY;

            copo.velocX = deslX * 0.65 + copo.velocX * 0.35;
            copo.velocY = deslY * 0.65 + copo.velocY * 0.35;

            const novoX = (novoImgX / canvas.width) * rect.width;
            const novoY = (novoImgY / canvas.height) * rect.height;

            copo.x = copo.x * (1 - copo.resp) + novoX * copo.resp;
            copo.y = copo.y * (1 - copo.resp) + novoY * copo.resp;

            copo.imgX = novoImgX;
            copo.imgY = novoImgY;
            copo.ultX = novoX;
            copo.ultY = novoY;
            copo.perdidos = 0;

            posicionar(elementos[nome], copo);

        } else {
            copo.perdidos++;

            if (copo.perdidos < copo.maxPerdidos) {
                copo.velocX *= 0.98;
                copo.velocY *= 0.98;

                copo.imgX += copo.velocX;
                copo.imgY += copo.velocY;

                copo.x = (copo.imgX / canvas.width) * rect.width;
                copo.y = (copo.imgY / canvas.height) * rect.height;

                posicionar(elementos[nome], copo);
            }
        }
    }

    requestAnimationFrame(rastrearTudo);
}

function posicionar(el, copo) {
    el.style.width = copo.w + 'px';
    el.style.height = copo.h + 'px';
    el.style.left = (copo.x - copo.w / 2) + 'px';
    el.style.top = (copo.y - copo.h / 2) + 'px';
}

btnReiniciar.addEventListener('click', () => {
    for (const nome of nomes) {
        copos[nome].marcado = false;
        copos[nome].perdidos = 0;
        copos[nome].raioBusca = 100;
        copos[nome].velocX = 0;
        copos[nome].velocY = 0;
        elementos[nome].style.display = 'none';
    }
    ordem = [];
    indiceAtual = 0;
    btnRoxo.disabled = false;
    btnPreto.disabled = btnAmarelo.disabled = true;
    btnReiniciar.style.display = 'none';
    aviso.innerHTML = '👆 TOQUE NO 1º COPO (ROXO)';
});

document.addEventListener('touchstart', marcarAtual, { passive: false });
document.addEventListener('mousedown', marcarAtual);
</script>
</body>
</html>
