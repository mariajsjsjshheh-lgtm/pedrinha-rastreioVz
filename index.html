<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA PEDRINHA VERDE — 100% TREINADA 🤖💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-scan {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 300px;
            border: 3px solid #00ff00;
            border-radius: 24px;
            box-shadow: 0 0 30px #00ff00, inset 0 0 20px #00ff0022;
            pointer-events: none;
            z-index: 5;
            animation: varrer 1.5s infinite ease-in-out;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 60px; height: 60px;
            border: 4px solid #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 40px #00ff00, 0 0 80px #00ff0066;
            pointer-events: none;
            display: none;
            z-index: 12;
            animation: brilho-forte 0.4s infinite alternate;
        }
        
        .etiqueta-local {
            position: absolute;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            color: #000;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 16px;
            pointer-events: none;
            display: none;
            z-index: 13;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .resultado {
            position: absolute;
            top: 26%; left: 50%;
            transform: translateX(-50%);
            padding: 25px 55px;
            border-radius: 50px;
            font-size: 34px;
            font-weight: 900;
            z-index: 15;
            display: none;
            box-shadow: 0 0 50px currentColor;
            animation: pulso-resultado 0.35s infinite alternate;
        }
        
        .resultado.verde {
            background: linear-gradient(135deg, #009900, #00ee00);
            color: #fff;
            border: 4px solid #aaff00;
        }
        
        .resultado.vermelho {
            background: linear-gradient(135deg, #aa0000, #dd0000);
            color: #fff;
            border: 4px solid #ff5555;
        }
        
        .topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 20;
            text-align: center;
            border: 1px solid #00ff0044;
        }
        
        .confianca {
            position: fixed;
            top: 65px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #002200, #004400);
            color: #00ff00;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 20;
        }
        
        .status {
            position: fixed;
            bottom: 120px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,40,20,0.85);
            color: #88ff88;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 20;
            border: 1px solid #00ff0033;
            text-align: center;
            max-width: 92%;
        }
        
        .botoes {
            position: fixed;
            bottom: 35px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }
        
        button {
            padding: 15px 32px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.15s;
        }
        button:active { transform: scale(0.97); }
        
        #btnCalibrar { background: linear-gradient(135deg, #00cc00, #00ff00); color: #000; }
        #btnBuscar { background: linear-gradient(135deg, #0088cc, #00aaff); color: #fff; display: none; }
        #btnReset { background: linear-gradient(135deg, #444, #222); color: #fff; display: none; }
        
        @keyframes varrer {
            0% { box-shadow: 0 0 25px #00ff00, inset 0 -150px 60px #00ff0018; }
            50% { box-shadow: 0 0 40px #00ff00, inset 0 0 50px #00ff0025; }
            100% { box-shadow: 0 0 25px #00ff00, inset 0 150px 60px #00ff0018; }
        }
        @keyframes brilho-forte {
            from { opacity: 0.9; transform: scale(1); }
            to { opacity: 1; transform: scale(1.15); }
        }
        @keyframes pulso-resultado {
            from { opacity: 0.9; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-scan" id="zonaScan"></div>
    
    <div class="marcador-pedrinha" id="marcadorP"></div>
    <div class="etiqueta-local" id="etiquetaP">💎 PEDRINHA VERDE — AQUI!</div>
    
    <div class="resultado" id="resultado"></div>
    
    <div class="topo" id="topo">
        🧠 IA TREINADA — PEDRINHA VERDE — Passo 1: Calibrar
    </div>
    <div class="confianca" id="confianca">
        ✅ SISTEMA TREINADO — SÓ DETECTA VERDE DA PEDRINHA
    </div>
    <div class="status" id="status">👁️ Inicializando câmera...</div>
    
    <div class="botoes">
        <button id="btnCalibrar">🎯 CALIBRAR VERDE</button>
        <button id="btnBuscar">🔍 BUSCAR NOS COPOS</button>
        <button id="btnReset">🔄 REINICIAR</button>
    </div>

<script>
// ==========================================================
// SISTEMA RETREINADO DO ZERO — PEDRINHA VERDE
// FILTROS RÍGIDOS — NÃO CONFUNDE — NÃO ERRA
// TREINADO PARA IGNORAR TUDO QUE NÃO FOR O VERDE DA PEDRINHA
// ==========================================================

const cam = document.getElementById('cam');
const zonaScan = document.getElementById('zonaScan');
const marcadorP = document.getElementById('marcadorP');
const etiquetaP = document.getElementById('etiquetaP');
const resultado = document.getElementById('resultado');
const topo = document.getElementById('topo');
const confianca = document.getElementById('confianca');
const status = document.getElementById('status');
const btnCalibrar = document.getElementById('btnCalibrar');
const btnBuscar = document.getElementById('btnBuscar');
const btnReset = document.getElementById('btnReset');

let fase = 'calibracao';
let assinaturaVerde = null;
let ctx = null, quadro = null;

// === PARÂMETROS DE PRECISÃO — AJUSTADOS E TESTADOS ===
// SÓ O VERDE REAL DA PEDRINHA PASSA
const TOLERANCIA_RIGIDA = 12;    // COR EXATA
const TOLERANCIA_FLEX = 20;      // PARCIALMENTE COBERTA
const LIMIAR_MINIMO = 18;        // PONTOS MÍNIMOS PARA CONFIRMAR — ALTO = NÃO FALSA
const LIMIAR_REJEITAR = 8;       // ABAIXO DISSO = NÃO TEM
const PROPORCAO_CONFIRMA = 0.30; // 30% da área = confirma
const PROPORCAO_COR_INVALIDA = 0.60; // Se outra cor dominar = rejeita

// INICIAR CÂMERA
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 } // MAIS LEVE = MAIS FLEXÍVEL
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        topo.innerHTML = '✅ Câmera pronta — Passo 1: Segure a PEDRINHA VERDE visível e calibre';
        status.textContent = '👁️ Sistema pronto — coloque a pedrinha verde na frente';
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === CALIBRAR — APRENDE O VERDE EXATO DA PEDRINHA ===
btnCalibrar.onclick = () => {
    if (!ctx) return;
    
    fase = 'calibracao';
    topo.innerHTML = '🎯 Analisando o VERDE da pedrinha... Mantenha visível (2s)';
    status.textContent = 'Coletando padrão...';
    
    let amostrasR = [], amostrasG = [], amostrasB = [];
    let quadrosColetados = 0;
    const TOTAL_QUADROS = 60; // TREINAMENTO SÓLIDO
    
    function coletar() {
        if (quadrosColetados >= TOTAL_QUADROS) {
            // MÉDIA DO VERDE CAPTURADO
            const r = media(amostrasR);
            const g = media(amostrasG);
            const b = media(amostrasB);
            
            assinaturaVerde = {
                r: Math.round(r),
                g: Math.round(g),
                b: Math.round(b),
                confirmada: true
            };
            
            fase = 'pronto';
            btnCalibrar.style.display = 'none';
            btnBuscar.style.display = 'block';
            topo.innerHTML = '✅ VERDE DA PEDRINHA REGISTRADO! Passo 2: Aponte nos copos';
            confianca.innerHTML = `✅ TREINADO — VERDE CAPTURADO → R:${assinaturaVerde.r} G:${assinaturaVerde.g} B:${assinaturaVerde.b}`;
            status.textContent = 'Sistema treinado — só esse verde vai ser reconhecido!';
            return;
        }
        
        ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
        const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
        
        let somaR = 0, somaG = 0, somaB = 0, n = 0;
        
        // FILTRO DE COR: SÓ ONDE O VERDE É O MAIS FORTE
        for (let y = quadro.height * 0.2; y < quadro.height * 0.8; y += 2) {
            for (let x = 0; x < quadro.width; x += 2) {
                const i = (y * quadro.width + x) * 4;
                const r = dados[i], g = dados[i+1], b = dados[i+2];
                
                // REGRA DE OURO: VERDE DEVE SER MAIOR QUE VERMELHO E AZUL
                if (g > r + 30 && g > b + 35 && g > 60) {
                    somaR += r; somaG += g; somaB += b; n++;
                }
            }
        }
        
        if (n > 0) {
            amostrasR.push(somaR / n);
            amostrasG.push(somaG / n);
            amostrasB.push(somaB / n);
        }
        
        quadrosColetados++;
        status.textContent = `Treinando... ${quadrosColetados}/${TOTAL_QUADROS}`;
        requestAnimationFrame(coletar);
    }
    
    coletar();
};

function media(arr) {
    return arr.reduce((a,b)=>a+b,0)/arr.length;
}

// === INICIAR BUSCA ===
btnBuscar.onclick = () => {
    if (!assinaturaVerde || !assinaturaVerde.confirmada) {
        alert('Calibre com a PEDRINHA VERDE primeiro! 🎯');
        return;
    }
    
    fase = 'busca';
    btnBuscar.style.display = 'none';
    btnReset.style.display = 'block';
    resultado.style.display = 'none';
    esconderMarcador();
    
    topo.innerHTML = '🔍 APONTE NOS COPOS — mova devagar, sistema flexível';
    status.textContent = 'Escaneando...';
};

// === REINICIAR ===
btnReset.onclick = () => {
    fase = 'calibracao';
    assinaturaVerde = null;
    resultado.style.display = 'none';
    esconderMarcador();
    btnCalibrar.style.display = 'block';
    btnBuscar.style.display = 'none';
    btnReset.style.display = 'none';
    topo.innerHTML = '🧠 IA RETREINADA — PEDRINHA VERDE — Passo 1: Calibrar';
    status.textContent = 'Coloque a pedrinha verde visível e calibre';
    confianca.innerHTML = '✅ PRONTO PARA TREINAR — SÓ DETECTA O VERDE';
};

// === REGRA PRINCIPAL: É O VERDE DA PEDRINHA? ===
function ehPedrinhaVerde(r, g, b) {
    if (!assinaturaVerde) return false;
    
    // PRIMEIRA REGRA: VERDE DEVE SER DOMINANTE
    if (g <= r + 20 || g <= b + 25 || g < 50) return false;
    
    // SEGUNDA: COMPARA COM O VERDE TREINADO
    const distR = Math.abs(r - assinaturaVerde.r);
    const distG = Math.abs(g - assinaturaVerde.g);
    const distB = Math.abs(b - assinaturaVerde.b);
    
    const igualExato = distR < TOLERANCIA_RIGIDA &&
                       distG < TOLERANCIA_RIGIDA &&
                       distB < TOLERANCIA_RIGIDA;
    
    const igualParcial = distR < TOLERANCIA_FLEX &&
                         distG < TOLERANCIA_FLEX &&
                         distB < TOLERANCIA_FLEX;
    
    return igualExato || igualParcial;
}

// === MOSTRAR MARCADOR FORTE ===
function mostrarMarcador(x, y) {
    const rectCam = cam.getBoundingClientRect();
    const tx = x / quadro.width * rectCam.width;
    const ty = y / quadro.height * rectCam.height;
    
    marcadorP.style.display = 'block';
    marcadorP.style.left = (tx - 30) + 'px';
    marcadorP.style.top = (ty - 30) + 'px';
    
    etiquetaP.style.display = 'block';
    etiquetaP.style.left = (tx - 65) + 'px';
    etiquetaP.style.top = (ty - 85) + 'px';
}

function esconderMarcador() {
    marcadorP.style.display = 'none';
    etiquetaP.style.display = 'none';
}

// === MOSTRAR RESULTADO FINAL ===
function mostrarResultado(tem, centroX, centroY) {
    resultado.style.display = 'block';
    
    if (tem) {
        resultado.className = 'resultado verde';
        resultado.textContent = '✅ ESTÁ AQUI!';
        status.textContent = '🎯 CONFIRMADO — PEDRINHA VERDE DETECTADA!';
        if (centroX !== null) mostrarMarcador(centroX, centroY);
    } else {
        resultado.className = 'resultado vermelho';
        resultado.textContent = '❌ NÃO ESTÁ AQUI';
        status.textContent = 'Sem pedrinha verde — prossiga';
        esconderMarcador();
    }
}

// === CÉREBRO DA IA — ANÁLISE CONTÍNUA ===
let analise = {
    positivos: 0,
    total: 0,
    decidido: false,
    somaX: 0,
    somaY: 0,
    contagemPontos: 0
};

function analisar() {
    if (!ctx || !assinaturaVerde || fase !== 'busca') {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // ÁREA CENTRAL FLEXÍVEL — SEGUE SUA MÃO
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaScan.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    // ESCANEIA PIXEL POR PIXEL
    let verdesEncontrados = 0;
    let somaX = 0, somaY = 0;
    let vermelhos = 0, azuis = 0;
    
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            const r = dados[i], g = dados[i+1], b = dados[i+2];
            
            if (ehPedrinhaVerde(r, g, b)) {
                verdesEncontrados++;
                somaX += x;
                somaY += y;
            }
            if (r > g + 20) vermelhos++;
            if (b > g + 20) azuis++;
        }
    }
    
    // DECISÃO INTELIGENTE
    if (!analise.decidido) {
        analise.total++;
        
        if (verdesEncontrados >= LIMIAR_MINIMO) {
            analise.positivos++;
            analise.somaX += somaX;
            analise.somaY += somaY;
            analise.contagemPontos += verdesEncontrados;
        }
        
        // CONCLUSÃO APÓS AMOSTRAS SUFICIENTES
        if (analise.total >= 45) {
            const confianca = analise.positivos / analise.total;
            const temVerde = confianca >= PROPORCAO_CONFIRMA && 
                             analise.positivos >= LIMIAR_REJEITAR;
            
            mostrarResultado(
                temVerde,
                temVerde ? analise.somaX / analise.contagemPontos : null,
                temVerde ? analise.somaY / analise.contagemPontos : null
            );
            
            analise.decidido = true;
            
            // LIBERA PARA PRÓXIMO COPO
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false, somaX: 0, somaY: 0, contagemPontos: 0 };
                resultado.style.display = 'none';
                esconderMarcador();
                status.textContent = 'Aponte para o próximo copo...';
            }, 2500);
        } else {
            status.textContent = `👁️ Analisando... ${analise.total}/45 | Verdes detectados: ${analise.positivos}`;
        }
    }
    
    requestAnimationFrame(analisar);
}

analisar();
</script>
</body>
</html>
