<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COPOS — SEM DETECTAR O DEDO ✅</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    .cobertura {
        position: absolute;
        pointer-events: none;
        z-index: 50;
        display: none;
        border-radius: 8px;
        opacity: 0.95;
        box-shadow: 0 0 35px currentColor;
        transition: left 0.01s linear, top 0.01s linear;
    }

    .roxo { background: #9933ff; color: #9933ff; }
    .preto { background: #111; color: #444; border: 3px solid #777; }
    .amarelo { background: #ffcc00; color: #ffcc00; }

    .etiqueta {
        position: absolute;
        top: -24px; left: 50%;
        transform: translateX(-50%);
        color: white; font-size: 12px; font-weight: 900;
        padding: 4px 12px; border-radius: 12px; white-space: nowrap;
    }
    .roxo .etiqueta { background: #9933ff; }
    .preto .etiqueta { background: #444; }
    .amarelo .etiqueta { background: #ffcc00; color: #000; }

    .aviso {
        position: fixed; top: 12px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.9); color: white;
        padding: 14px 24px; border-radius: 30px; font-size: 15px;
        z-index: 200; border: 2px solid #9933ff; text-align: center; max-width: 95%;
    }

    .botoes {
        position: fixed; bottom: 25px; left: 50%;
        transform: translateX(-50%); display: flex; gap: 10px; flex-wrap: wrap;
        justify-content: center; z-index: 200;
    }

    button {
        padding: 14px 22px; font-size: 14px; font-weight: bold;
        border: none; border-radius: 50px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }

    #btnMarcar { background: #9933ff; color: white; }
    #btnReligar { background: #ff4444; color: white; }
    #btnReiniciar { background: #009688; color: white; display: none; }
</style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <div class="cobertura roxo" id="cRoxo">
        <div class="etiqueta">🟣 ROXO</div>
    </div>
    <div class="cobertura preto" id="cPreto">
        <div class="etiqueta">⚫ PRETO</div>
    </div>
    <div class="cobertura amarelo" id="cAmarelo">
        <div class="etiqueta">🟡 AMARELO</div>
    </div>

    <div class="aviso" id="aviso">
        👆 TOQUE LADO DE FORA DO COPO — NÃO TAPA O CENTRO
    </div>

    <div class="botoes">
        <button id="btnMarcar">🎯 MARCAR PEDRINHA</button>
        <button id="btnReligar">📷 RELIGAR CÂMERA</button>
        <button id="btnReiniciar">🔄 REINICIAR</button>
    </div>

<script>
const cam = document.getElementById('cam');
const cRoxo = document.getElementById('cRoxo');
const cPreto = document.getElementById('cPreto');
const cAmarelo = document.getElementById('cAmarelo');
const aviso = document.getElementById('aviso');
const btnMarcar = document.getElementById('btnMarcar');
const btnReligar = document.getElementById('btnReligar');
const btnReiniciar = document.getElementById('btnReiniciar');

let canvas, ctx;
let streamAtual = null;

const alvo = {
    marcado: false,
    corRef: { r:0, g:0, b:0, tol:42 },
    x:0, y:0, imgX:0, imgY:0,
    velocX:0, velocY:0,
    raioBusca:110,
    resp:0.92,
    perdidos:0,
    maxPerdidos:600,
    // ZONA PROTEGIDA — ONDE O DEDO NÃO MEXE
    raioIgnorarDedo:45
};

const coberturas = [
    { el:cRoxo, w:75, h:105, deslX:-95, deslY:0 },
    { el:cPreto, w:85, h:110, deslX:0, deslY:0 },
    { el:cAmarelo, w:75, h:105, deslX:95, deslY:0 }
];

async function ligarCamera() {
    try {
        if (streamAtual) streamAtual.getTracks().forEach(t => t.stop());

        streamAtual = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 1280, min: 640 },
                height: { ideal: 720, min: 480 },
                frameRate: { ideal: 30, min: 15 }
            },
            audio: false
        });

        cam.srcObject = streamAtual;
        await new Promise(res => cam.onloadedmetadata = res);

        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;

        aviso.innerHTML = '✅ PRONTO! Toque na PEDRA — sem tampar o meio!';

    } catch (erro) {
        alert('Permita a câmera! 📷');
    }
}

// SALVA ONDE FOI TOCADO PRA IGNORAR O DEDO
let toqueX = -9999;
let toqueY = -9999;

function marcarPedrinha(e) {
    e.preventDefault();
    if (!canvas || alvo.marcado) return;

    const t = e.touches ? e.touches[0] : e;
    const rect = cam.getBoundingClientRect();

    // ONDE O DEDO TOCU — GUARDA PRA IGNORAR DEPOIS
    toqueX = (t.clientX / rect.width) * canvas.width;
    toqueY = (t.clientY / rect.height) * canvas.height;

    alvo.x = t.clientX;
    alvo.y = t.clientY;
    alvo.imgX = toqueX;
    alvo.imgY = toqueY;
    alvo.marcado = true;
    alvo.perdidos = 0;

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let r=0, g=0, b=0, q=0;

    // PEGA A COR AO REDOR — FORA DO DEDO
    for (let dy = -55; dy <= 55; dy += 2) {
        for (let dx = -55; dx <= 55; dx += 2) {
            const px = Math.round(alvo.imgX + dx);
            const py = Math.round(alvo.imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            
            // ✅ IGNORA O CENTRO — ONDE O DEDO TÁ TAPANDO
            const dist = Math.hypot(dx, dy);
            if (dist < alvo.raioIgnorarDedo) continue;
            if (dist > 55) continue;

            const i = (py * canvas.width + px) * 4;
            r += dados[i]; g += dados[i+1]; b += dados[i+2]; q++;
        }
    }

    if (q < 10) {
        alvo.corRef.r = 128;
        alvo.corRef.g = 128;
        alvo.corRef.b = 128;
    } else {
        alvo.corRef.r = Math.round(r / q);
        alvo.corRef.g = Math.round(g / q);
        alvo.corRef.b = Math.round(b / q);
    }

    coberturas.forEach(c => c.el.style.display = 'block');
    aviso.innerHTML = '✅ MARCADO! Mexa os copos — as cores ficam grudadas!';
    btnMarcar.disabled = true;
    btnReiniciar.style.display = 'block';
    btnReligar.style.display = 'none';

    rastrear();
}

function rastrear() {
    if (!alvo.marcado || !canvas) {
        requestAnimationFrame(rastrear);
        return;
    }

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const rect = cam.getBoundingClientRect();

    const centroX = alvo.imgX + alvo.velocX * 0.6;
    const centroY = alvo.imgY + alvo.velocY * 0.6;

    let somaX = 0, somaY = 0, q = 0;

    for (let dy = -alvo.raioBusca; dy <= alvo.raioBusca; dy += 2) {
        for (let dx = -alvo.raioBusca; dx <= alvo.raioBusca; dx += 2) {
            const px = Math.round(centroX + dx);
            const py = Math.round(centroY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > alvo.raioBusca) continue;

            // ✅ NÃO OLHA ONDE O DEDO TAVA — FICA FORA
            const distToque = Math.hypot(px - toqueX, py - toqueY);
            if (distToque < alvo.raioIgnorarDedo * 0.7) continue;

            const i = (py * canvas.width + px) * 4;
            const dr = Math.abs(dados[i] - alvo.corRef.r);
            const dg = Math.abs(dados[i+1] - alvo.corRef.g);
            const db = Math.abs(dados[i+2] - alvo.corRef.b);

            if (dr < alvo.corRef.tol && dg < alvo.corRef.tol && db < alvo.corRef.tol) {
                somaX += px; somaY += py; q++;
            }
        }
    }

    if (q >= 8) {
        const novoIX = somaX / q;
        const novoIY = somaY / q;
        const dX = novoIX - alvo.imgX;
        const dY = novoIY - alvo.imgY;

        alvo.velocX = dX * 0.85 + alvo.velocX * 0.15;
        alvo.velocY = dY * 0.85 + alvo.velocY * 0.15;

        const novoX = (novoIX / canvas.width) * rect.width;
        const novoY = (novoIY / canvas.height) * rect.height;

        alvo.x = alvo.x * (1 - alvo.resp) + novoX * alvo.resp;
        alvo.y = alvo.y * (1 - alvo.resp) + novoY * alvo.resp;
        alvo.imgX = novoIX;
        alvo.imgY = novoIY;
        alvo.perdidos = 0;
    } else {
        alvo.perdidos++;
        // SEGUE A DIREÇÃO — NÃO SOLTA MESMO SEM VER
        alvo.imgX += alvo.velocX;
        alvo.imgY += alvo.velocY;
        alvo.x = (alvo.imgX / canvas.width) * rect.width;
        alvo.y = (alvo.imgY / canvas.height) * rect.height;
    }

    coberturas.forEach(c => {
        c.el.style.width = c.w + 'px';
        c.el.style.height = c.h + 'px';
        c.el.style.left = (alvo.x - c.w/2 + c.deslX) + 'px';
        c.el.style.top = (alvo.y - c.h/2 + c.deslY) + 'px';
    });

    requestAnimationFrame(rastrear);
}

document.addEventListener('touchstart', marcarPedrinha, { passive: false });
document.addEventListener('mousedown', marcarPedrinha);

btnReiniciar.onclick = () => {
    alvo.marcado = false;
    alvo.velocX = alvo.velocY = 0;
    toqueX = toqueY = -9999;
    coberturas.forEach(c => c.el.style.display = 'none');
    btnMarcar.disabled = false;
    btnReiniciar.style.display = 'none';
    btnReligar.style.display = 'block';
    aviso.innerHTML = '👆 TOQUE LADO DE FORA DO COPO — NÃO TAPA O CENTRO';
};

ligarCamera();
</script>
</body>
</html>
