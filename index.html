<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IA SEGUE COPO — NÃO PARA, NÃO SOME 🧠🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            touch-action: none;
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* GOTINHA — FIXA, NÃO SOME */
        .marcador-alvo {
            position: absolute;
            width: 56px; height: 70px;
            pointer-events: none;
            z-index: 100;
            display: none;
            filter: drop-shadow(0 0 12px rgba(0, 150, 136, 0.9))
                    drop-shadow(0 0 25px rgba(0, 150, 136, 0.5));
        }

        .gotinha-svg {
            width: 100%; height: 100%;
        }

        .anel-pulso {
            position: absolute;
            top: 50%; left: 50%;
            width: 70px; height: 84px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 150, 136, 0.5);
            border-radius: 50% / 40%;
            animation: expandir 1.5s ease-out infinite;
        }

        .etiqueta {
            position: absolute;
            top: -28px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #009688, #00bfa5);
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        @keyframes expandir {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }

        .cabecalho {
            position: fixed;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 200;
            text-align: center;
            border: 2px solid #009688;
            max-width: 94%;
        }

        .dados-ia {
            position: fixed;
            top: 72px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,20,20,0.85);
            color: #80ffea;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 200;
            border: 1px solid rgba(0, 150, 136, 0.3);
        }

        .botoes {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex; gap: 15px;
        }

        button {
            padding: 15px 32px;
            font-size: 15px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button:active { transform: scale(0.96); }

        #btnMarcar {
            background: linear-gradient(135deg, #009688, #00bfa5);
            color: white;
        }
        #btnNovo {
            background: linear-gradient(135deg, #ff9800, #ffb300);
            color: #000;
            display: none;
        }
    </style>
</head>
<body>
    <video id="camera" autoplay playsinline muted></video>

    <!-- GOTINHA QUE NÃO SOME -->
    <div class="marcador-alvo" id="marcador">
        <svg class="gotinha-svg" viewBox="0 0 52 64">
            <path d="M26 0 C26 0 0 24 0 42 C0 54 11.7 64 26 64 C40.3 64 52 54 52 42 C52 24 26 0 26 0 Z" 
                  fill="#009688" />
        </svg>
        <div class="anel-pulso"></div>
        <div class="etiqueta" id="etiqueta">🎯 COPO MARCADO</div>
    </div>

    <div class="cabecalho" id="cabecalho">
        👆 TOQUE NO COPO → A IA SEGUE SOZINHA, NÃO SOME!
    </div>

    <div class="dados-ia" id="dadosIA">
        Aguardando seleção...
    </div>

    <div class="botoes">
        <button id="btnMarcar">🎯 MARCAR COPO</button>
        <button id="btnNovo">🔄 TROCAR DE COPO</button>
    </div>

<script>
// =================================================================
// VERSÃO FINAL — SEM BOTÃO DE PARAR, IA SEGUE SOZINHA, NÃO SOME
// =================================================================
// ✅ Toca no copo → IA FIXA E SEGUE SOZINHA, VOCÊ NÃO ARRASTA
// ✅ Move o copo → ela acompanha sozinha
// ✅ NÃO SOME NUNCA — do início ao fim
// ✅ Sem botão de pausar/parar — só MARCAR e TROCAR
// ✅ Memória visual: lembra a aparência do copo e segue
// =================================================================

const camera = document.getElementById('camera');
const marcador = document.getElementById('marcador');
const etiqueta = document.getElementById('etiqueta');
const cabecalho = document.getElementById('cabecalho');
const dadosIA = document.getElementById('dadosIA');
const btnMarcar = document.getElementById('btnMarcar');
const btnNovo = document.getElementById('btnNovo');

// === MEMÓRIA DO ALVO ===
const alvo = {
    ativo: false,
    x: 0, y: 0,
    xAnterior: 0, yAnterior: 0,
    velocidadeX: 0, velocidadeY: 0,
    
    // Modelo visual do alvo — o que foi marcado
    amostrasCor: [],
    corMedia: { r: 0, g: 0, b: 0 },
    toleranciaCor: 45,
    
    // Região de rastreamento — busca ao redor
    buscaX: 0, buscaY: 0,
    raioBusca: 150, // Área ampla para acompanhar movimento rápido
    
    // Controle de persistência
    quadrosSemAlvo: 0,
    maxQuadrosPerdidos: 90, // Continua seguindo por tempo mesmo se esconder
    
    // Suavização
    suavX: 0, suavY: 0,
    fatorResposta: 0.25 // Quanto mais rápido = mais ágil
};

let canvas, ctx;

// === INICIAR CÂMERA ===
navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: 1280, height: 720 }
}).then(fluxo => {
    camera.srcObject = fluxo;
    camera.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;
        cabecalho.innerHTML = '✅ Câmera pronta — Toque no copo para marcar!';
    };
}).catch(() => alert('Permita o acesso à câmera! 📷'));

// === MARCAR ALVO AO TOCAR ===
function marcarAlvoNaTela(e) {
    e.preventDefault();
    if (!canvas) return;

    // Pega onde tocou
    let tx, ty;
    if (e.touches) {
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
    } else {
        tx = e.clientX;
        ty = e.clientY;
    }

    // Converte para coordenada da imagem da câmera
    const rect = camera.getBoundingClientRect();
    const imgX = (tx / rect.width) * canvas.width;
    const imgY = (ty / rect.height) * canvas.height;

    // === LER COR DO ALVO ===
    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    // Amostra cor ao redor do ponto tocado
    let r=0, g=0, b=0, qt=0;
    for (let dy = -25; dy <= 25; dy += 3) {
        for (let dx = -25; dx <= 25; dx += 3) {
            const px = Math.round(imgX + dx);
            const py = Math.round(imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            const i = (py * canvas.width + px) * 4;
            r += imgData[i];
            g += imgData[i+1];
            b += imgData[i+2];
            qt++;
        }
    }

    // Salva "assinatura" do alvo
    alvo.corMedia = {
        r: Math.round(r/qt),
        g: Math.round(g/qt),
        b: Math.round(b/qt)
    };

    // Inicializa posição
    alvo.x = tx;
    alvo.y = ty;
    alvo.suavX = tx;
    alvo.suavY = ty;
    alvo.xAnterior = tx;
    alvo.yAnterior = ty;
    alvo.velocidadeX = 0;
    alvo.velocidadeY = 0;
    alvo.quadrosSemAlvo = 0;
    alvo.ativo = true;

    // Área de busca começa ao redor do alvo
    alvo.buscaX = imgX;
    alvo.buscaY = imgY;

    // Mostra gotinha
    marcador.style.display = 'block';
    posicionarGotinha(tx, ty);

    // Atualiza tela
    cabecalho.innerHTML = '✅ COPO MARCADO — Mova ele que a IA segue sozinha!';
    dadosIA.innerHTML = `Cor capturada — seguindo...`;

    btnMarcar.style.display = 'none';
    btnNovo.style.display = 'block';

    // Inicia rastreamento contínuo
    rastrear();
}

// === IA BUSCA O ALVO A CADA INSTANTE ===
function rastrear() {
    if (!alvo.ativo || !ctx) return;

    ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    const rect = camera.getBoundingClientRect();

    // Converte posição atual para coordenada da imagem
    const imgLargura = canvas.width;
    const imgAltura = canvas.height;
    const escalaX = imgLargura / rect.width;
    const escalaY = imgAltura / rect.height;

    // CENTRO DE BUSCA: onde estava + previsão de movimento
    const centroBuscaX = alvo.buscaX + alvo.velocidadeX * escalaX * 0.5;
    const centroBuscaY = alvo.buscaY + alvo.velocidadeY * escalaY * 0.5;

    // VARRE ÁREA AO REDOR BUSCANDO A COR DO ALVO
    let somaX = 0, somaY = 0, qt = 0;
    const raio = alvo.raioBusca;

    for (let dy = -raio; dy <= raio; dy += 2) {
        for (let dx = -raio; dx <= raio; dx += 2) {
            const px = Math.round(centroBuscaX + dx);
            const py = Math.round(centroBuscaY + dy);

            if (px < 0 || px >= imgLargura || py < 0 || py >= imgAltura) continue;

            const distCentro = Math.hypot(dx, dy);
            if (distCentro > raio) continue; // Só dentro do círculo de busca

            const i = (py * imgLargura + px) * 4;
            const r = imgData[i], g = imgData[i+1], b = imgData[i+2];

            // Compara com a cor do copo marcado
            const dr = Math.abs(r - alvo.corMedia.r);
            const dg = Math.abs(g - alvo.corMedia.g);
            const db = Math.abs(b - alvo.corMedia.b);

            if (dr < alvo.toleranciaCor && dg < alvo.toleranciaCor && db < alvo.toleranciaCor) {
                somaX += px;
                somaY += py;
                qt++;
            }
        }
    }

    let novoXImg, novoYImg;
    let encontrado = false;

    if (qt >= 15) {
        // ✅ ENCONTROU — centro de massa dos pontos
        novoXImg = somaX / qt;
        novoYImg = somaY / qt;
        alvo.quadrosSemAlvo = 0;
        alvo.buscaX = novoXImg;
        alvo.buscaY = novoYImg;
        encontrado = true;
        etiqueta.textContent = '🎯 SEGUINDO!';
    } else {
        // ⚠️ NÃO ENCONTROU AGORA → PREVER PELA VELOCIDADE
        alvo.quadrosSemAlvo++;
        if (alvo.quadrosSemAlvo <= alvo.maxQuadrosPerdidos) {
            // Continua pela trajetória calculada
            novoXImg = alvo.buscaX + alvo.velocidadeX * escalaX;
            novoYImg = alvo.buscaY + alvo.velocidadeY * escalaY;
            etiqueta.textContent = '🔮 PREVENDO...';
            encontrado = true;
        } else {
            // ❌ Perdido por muito tempo — NÃO SOME, avisa e continua tentando
            novoXImg = alvo.buscaX;
            novoYImg = alvo.buscaY;
            etiqueta.textContent = '🔍 BUSCANDO...';
            encontrado = true;
        }
    }

    // === CONVERTE PARA TELA ===
    let novoX = (novoXImg / canvas.width) * rect.width;
    let novoY = (novoYImg / canvas.height) * rect.height;

    // === CALCULA VELOCIDADE ===
    alvo.velocidadeX = (novoX - alvo.xAnterior) * 0.7 + alvo.velocidadeX * 0.3;
    alvo.velocidadeY = (novoY - alvo.yAnterior) * 0.7 + alvo.velocidadeY * 0.3;

    // === SUAVIZAÇÃO ===
    alvo.suavX = alvo.suavX * (1 - alvo.fatorResposta) + novoX * alvo.fatorResposta;
    alvo.suavY = alvo.suavY * (1 - alvo.fatorResposta) + novoY * alvo.fatorResposta;

    // === ATUALIZA ===
    alvo.xAnterior = alvo.x;
    alvo.yAnterior = alvo.y;
    alvo.x = alvo.suavX;
    alvo.y = alvo.suavY;

    // === POSICIONA — NÃO SOME ===
    posicionarGotinha(alvo.x, alvo.y);

    // Dados
    const lado = alvo.x < rect.width * 0.33 ? '⬅️ ESQUERDA' :
                  alvo.x < rect.width * 0.66 ? '➡️ MEIO' : '➡️ DIREITA';
    dadosIA.innerHTML = `${lado} | Pontos: ${qt} | Perdidos: ${alvo.quadrosSemAlvo}`;

    // CONTINUA SEMPRE — NÃO PARA
    requestAnimationFrame(rastrear);
}

// === POSICIONA PONTA DA GOTINHA NO ALVO ===
function posicionarGotinha(px, py) {
    // Ponta no ponto exato
    marcador.style.left = (px - 28) + 'px';
    marcador.style.top = (py - 64) + 'px';
}

// === TROCAR DE COPO ===
btnNovo.addEventListener('click', () => {
    alvo.ativo = false;
    marcador.style.display = 'none';
    btnNovo.style.display = 'none';
    btnMarcar.style.display = 'block';
    cabecalho.innerHTML = '👆 TOQUE NO NOVO COPO PARA MARCAR!';
    dadosIA.innerHTML = 'Aguardando seleção...';
});

// === TOQUE = MARCAR ===
document.addEventListener('touchstart', marcarAlvoNaTela, { passive: false });
document.addEventListener('mousedown', marcarAlvoNaTela);
</script>
</body>
</html>
