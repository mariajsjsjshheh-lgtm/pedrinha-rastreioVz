<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SEGUE O COPO — CLICA E ACOMPANHA 💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            touch-action: none;
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ✅ O SÍMBOLO DA GOTINHA — IGUAL O DA FOTO */
        .marcador-selecao {
            position: absolute;
            width: 52px; height: 64px;
            pointer-events: none;
            z-index: 100;
            display: none;
            transition: left 0.08s ease-out, top 0.08s ease-out;
            filter: drop-shadow(0 0 8px rgba(0, 150, 136, 0.7));
        }

        .gotinha {
            width: 100%;
            height: 100%;
        }

        .rotulo {
            position: absolute;
            top: -28px; left: 50%;
            transform: translateX(-50%);
            background: #009688;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .instrucao {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 200;
            text-align: center;
            border: 2px solid #009688;
        }

        .status {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #80ffea;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 200;
        }

        .btn-resetar {
            position: fixed;
            bottom: 80px; left: 50%;
            transform: translateX(-50%);
            background: #009688;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 15px rgba(0,150,136,0.4);
        }
        .btn-resetar:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>

    <!-- ✅ GOTINHA QUE SEGUE O COPO -->
    <div class="marcador-selecao" id="marcador">
        <svg class="gotinha" viewBox="0 0 52 64">
            <!-- Forma exata da gotinha da foto -->
            <path d="M26 0 C26 0 0 24 0 42 C0 54 11.7 64 26 64 C40.3 64 52 54 52 42 C52 24 26 0 26 0 Z" 
                  fill="#009688" />
        </svg>
        <div class="rotulo" id="rotulo">COPO SELECIONADO ✅</div>
    </div>

    <div class="instrucao" id="instrucao">
        👆 TOQUE NO COPO PARA MARCAR — ele vai seguir pra onde for!
    </div>

    <button class="btn-resetar" id="btnReset">🔄 ESCOLHER OUTRO COPO</button>

    <div class="status" id="status">
        Aguardando você tocar no copo...
    </div>

<script>
// ==============================================================
// SISTEMA DE SEGUIMENTO POR TOQUE — IGUAL SELEÇÃO DE TEXTO
// ==============================================================
// ✅ TOCA NO COPO → GOTINHA APARECE E GRUDA
// ✅ MOVE O COPO → GOTINHA VAI JUNTO, SEM FICAR NO MEIO
// ✅ CLICA DE NOVO → TIRA E ESCOLHE OUTRO
// ✅ SIMPLES, SEM COMPLICAÇÃO DE COR
// ==============================================================

const cam = document.getElementById('cam');
const marcador = document.getElementById('marcador');
const rotulo = document.getElementById('rotulo');
const instrucao = document.getElementById('instrucao');
const btnReset = document.getElementById('btnReset');
const status = document.getElementById('status');

let seguindo = false;
let alvoX = 0, alvoY = 0;
let historico = [];
const SUAVIZACAO = 5; // Menor = mais rápido

// === LIGAR CÂMERA ===
navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: 1280, height: 720 }
}).then(stream => {
    cam.srcObject = stream;
}).catch(() => {
    alert('Permita a câmera! 📷');
});

// === TOQUE / CLIQUE NA TELA ===
document.addEventListener('touchstart', capturarToque, { passive: false });
document.addEventListener('mousedown', capturarToque);

function capturarToque(e) {
    e.preventDefault();

    // Se já está seguindo, parar e deixar escolher de novo
    if (seguindo) {
        pararSeguimento();
        return;
    }

    // Pegar posição exata onde tocou
    let x, y;
    if (e.touches) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
    } else {
        x = e.clientX;
        y = e.clientY;
    }

    // Começar a seguir AQUI
    alvoX = x;
    alvoY = y;
    historico = [];
    seguindo = true;

    // Mostrar gotinha
    marcador.style.display = 'block';
    posicaoGotinha(x, y);

    // Atualizar telas
    instrucao.innerHTML = '✅ SEGUINDO! Mova o copo que a gotinha acompanha';
    status.innerHTML = `📍 Posição travada — mova o copo!`;
}

// === MOVIMENTO — ACOMPANHA O ARRASTE ===
document.addEventListener('touchmove', moverAlvo, { passive: false });
document.addEventListener('mousemove', moverAlvo);

function moverAlvo(e) {
    if (!seguindo) return;
    e.preventDefault();

    let x, y;
    if (e.touches) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
    } else {
        x = e.clientX;
        y = e.clientY;
    }

    // Atualizar alvo com suavização
    alvoX = x;
    alvoY = y;

    // Salvar no histórico para movimento suave
    historico.push({ x, y });
    if (historico.length > SUAVIZACAO) historico.shift();

    // Calcular posição suavizada
    let sx = 0, sy = 0;
    for (let p of historico) { sx += p.x; sy += p.y; }
    sx /= historico.length;
    sy /= historico.length;

    // Colocar gotinha
    posicaoGotinha(sx, sy);
}

// === POSICIONAR A GOTINHA ===
function posicaoGotinha(x, y) {
    // Centralizar a gotinha no ponto tocado
    marcador.style.left = (x - 26) + 'px';
    marcador.style.top = (y - 48) + 'px'; // -48 = alinhar a ponta no ponto
}

// === PARAR SEGUIMENTO ===
function pararSeguimento() {
    seguindo = false;
    marcador.style.display = 'none';
    historico = [];
    instrucao.innerHTML = '👆 TOQUE NO COPO NOVAMENTE PARA ESCOLHER';
    status.innerHTML = 'Aguardando novo toque...';
}

// === BOTÃO RESETAR ===
btnReset.addEventListener('click', pararSeguimento);
</script>
</body>
</html>
