<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIÔNICO INFALÍVEL — 100% PRECISO 🤖👁️💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        /* OLHOS BIÔNICOS — SEM LIMITE DE ALCANCE */
        .visao-bionica {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 240px;
            border: 3px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 40px #00ffff, inset 0 0 25px #00ffff33;
            pointer-events: none;
            z-index: 5;
            animation: scan 1.2s infinite linear;
        }
        
        .grade-bionica {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 240px;
            background: 
                linear-gradient(90deg, transparent 49%, #00ffff1a 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, #00ffff1a 50%, transparent 51%);
            background-size: 15px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 6;
        }
        
        .resultado {
            position: absolute;
            top: 30%; left: 50%;
            transform: translateX(-50%);
            padding: 20px 45px;
            border-radius: 50px;
            font-size: 30px;
            font-weight: 900;
            z-index: 15;
            display: none;
            box-shadow: 0 0 40px currentColor;
            animation: brilho 0.3s infinite alternate;
        }
        
        .resultado.verde {
            background: linear-gradient(135deg, #009900, #00dd00);
            color: #fff;
            border: 4px solid #88ff00;
        }
        
        .resultado.vermelho {
            background: linear-gradient(135deg, #aa0000, #dd0000);
            color: #fff;
            border: 4px solid #ff4444;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 45px; height: 45px;
            border: 3px solid #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 25px #ffff00;
            pointer-events: none;
            display: none;
            z-index: 10;
            animation: pulso 0.5s infinite alternate;
        }
        
        .etiqueta-pedrinha {
            position: absolute;
            background: linear-gradient(135deg, #ffff00, #ffcc00);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 11;
        }
        
        .info-cabecalho {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 20;
            text-align: center;
            border: 1px solid #00ffff44;
        }
        
        .estatisticas {
            position: fixed;
            top: 70px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #002200, #004400);
            color: #00ff00;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 20;
            border: 1px solid #00ff0066;
        }
        
        .status-ia {
            position: fixed;
            bottom: 110px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,20,40,0.85);
            color: #00ffff;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 20;
            border: 1px solid #00ffff44;
        }
        
        .botoes {
            position: fixed;
            bottom: 35px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex; gap: 12px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        #btnMarcar { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        #btnProcurar { background: linear-gradient(135deg, #00aa00, #00dd00); color: #fff; display: none; }
        #btnReset { background: linear-gradient(135deg, #333, #555); color: #fff; display: none; }
        
        @keyframes scan {
            0% { box-shadow: 0 0 25px #00ffff, inset 0 -120px 40px #00ffff22; }
            50% { box-shadow: 0 0 40px #00ffff, inset 0 0 40px #00ffff33; }
            100% { box-shadow: 0 0 25px #00ffff, inset 0 120px 40px #00ffff22; }
        }
        
        @keyframes brilho {
            from { opacity: 0.9; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
        
        @keyframes pulso {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="visao-bionica" id="visaoBionica"></div>
    <div class="grade-bionica" id="gradeBionica"></div>
    
    <div class="resultado" id="resultado"></div>
    
    <div class="marcador-pedrinha" id="marcadorPedrinha"></div>
    <div class="etiqueta-pedrinha" id="etiquetaPedrinha">👁️ AQUII — DETECTADA!</div>
    
    <div class="info-cabecalho" id="infoCabecalho">
        🤖 SISTEMA BIÔNICO — PRECISÃO ABSOLUTA — Passo 1: Marcar pedrinha
    </div>
    <div class="estatisticas" id="estatisticas">
        ✅ PRECISÃO MÁXIMA — DIFERENCIA EXATA — SEM ERRO
    </div>
    <div class="status-ia" id="statusIA">👁️ Sistema em espera...</div>
    
    <div class="botoes">
        <button id="btnMarcar">🎯 MARCAR PEDRINHA</button>
        <button id="btnProcurar">🔍 INICIAR BUSCA</button>
        <button id="btnReset">🔄 REINICIAR</button>
    </div>

<script>
// ==========================================================
// SISTEMA BIÔNICO — CORRIGIDO E APERFEIÇOADO
// DIFERENCIA O EXATO DO RESTO — NÃO ERRA NENHUM COPO
// ==========================================================

const cam = document.getElementById('cam');
const visaoBionica = document.getElementById('visaoBionica');
const resultado = document.getElementById('resultado');
const marcadorPedrinha = document.getElementById('marcadorPedrinha');
const etiquetaPedrinha = document.getElementById('etiquetaPedrinha');
const infoCabecalho = document.getElementById('infoCabecalho');
const estatisticas = document.getElementById('estatisticas');
const statusIA = document.getElementById('statusIA');
const btnMarcar = document.getElementById('btnMarcar');
const btnProcurar = document.getElementById('btnProcurar');
const btnReset = document.getElementById('btnReset');

let fase = 'marcacao';
let assinatura = null;
let ctx = null, quadro = null;

// TOLERÂNCIA APERTADA — SÓ A EXATA PASSA
const TOLERANCIA_RIGIDA = 12;   // Visão direta — muito rígida
const TOLERANCIA_COBERTA = 22;  // Parcialmente escondida — levemente mais ampla MAS CONTROLADA
const LIMIAR_CONFIRMACAO = 15;  // Quantos pontos iguais precisa pra confirmar
const LIMIAR_REJEICAO = 6;      // Abaixo disso = NÃO É

// LIGAR CÂMERA
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 60 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        infoCabecalho.innerHTML = '✅ Câmera pronta — Passo 1: Marcar pedrinha';
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

btnMarcar.onclick = () => {
    fase = 'marcacao';
    infoCabecalho.innerHTML = '👆 Passo 2: CLIQUE EXATAMENTE NO CENTRO DA PEDRINHA — capturando assinatura única...';
    statusIA.textContent = '🔭 Capturando identidade...';
    cam.style.cursor = 'crosshair';
};

// === CAPTURA ASSINATURA ÚNICA — IDENTIDADE EXATA ===
cam.onclick = (e) => {
    if (fase !== 'marcacao' || !ctx) return;
    
    const rect = cam.getBoundingClientRect();
    const escX = quadro.width / rect.width;
    const escY = quadro.height / rect.height;
    
    const x = (e.clientX - rect.left) * escX;
    const y = (e.clientY - rect.top) * escY;
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    
    // AMOSTRA EM VÁRIOS PONTOS — IDENTIDADE ÚNICA
    let r=0, g=0, b=0, n=0;
    let amostras = [];
    
    for(let raio = 0; raio <= 6; raio += 2) {
        for(let ang = 0; ang < 360; ang += 45) {
            const dx = raio * Math.cos(ang * Math.PI / 180);
            const dy = raio * Math.sin(ang * Math.PI / 180);
            const px = Math.max(0, Math.min(quadro.width-1, (x + dx) | 0));
            const py = Math.max(0, Math.min(quadro.height-1, (y + dy) | 0));
            const p = ctx.getImageData(px, py, 1, 1).data;
            r += p[0]; g += p[1]; b += p[2]; n++;
            amostras.push({r: p[0], g: p[1], b: p[2]});
        }
    }
    
    assinatura = {
        r: Math.round(r/n),
        g: Math.round(g/n),
        b: Math.round(b/n),
        amostras: amostras,
        confirmada: true
    };
    
    mostrarMarcador(x, y);
    
    fase = 'pronto';
    btnMarcar.style.display = 'none';
    btnProcurar.style.display = 'block';
    infoCabecalho.innerHTML = '🔒 ASSINATURA GRAVADA — NÃO MUDA MAIS! Passo 3: Iniciar busca!';
    statusIA.textContent = '👁️ Olhos biônicos prontos — diferenciam o exato do resto!';
    cam.style.cursor = 'default';
};

btnProcurar.onclick = () => {
    if (!assinatura || !assinatura.confirmada) {
        alert('Marque a pedrinha primeiro! 🎯');
        return;
    }
    
    fase = 'busca';
    btnProcurar.style.display = 'none';
    btnReset.style.display = 'block';
    resultado.style.display = 'none';
    
    infoCabecalho.innerHTML = '🔍 APONTE NOS COPOS — SEM LIMITE DE ANÁLISE — só o exato acende VERDE!';
    statusIA.textContent = 'Escaneando...';
};

btnReset.onclick = () => {
    fase = 'marcacao';
    assinatura = null;
    resultado.style.display = 'none';
    marcadorPedrinha.style.display = 'none';
    etiquetaPedrinha.style.display = 'none';
    btnMarcar.style.display = 'block';
    btnProcurar.style.display = 'none';
    btnReset.style.display = 'none';
    infoCabecalho.innerHTML = '🤖 SISTEMA BIÔNICO — Passo 1: Marcar pedrinha';
    statusIA.textContent = 'Reiniciado — marque de novo';
};

function mostrarMarcador(x, y) {
    const rect = cam.getBoundingClientRect();
    const tx = x / quadro.width * rect.width;
    const ty = y / quadro.height * rect.height;
    
    marcadorPedrinha.style.display = 'block';
    marcadorPedrinha.style.left = (tx - 22) + 'px';
    marcadorPedrinha.style.top = (ty - 22) + 'px';
    
    etiquetaPedrinha.style.display = 'block';
    etiquetaPedrinha.style.left = (tx - 45) + 'px';
    etiquetaPedrinha.style.top = (ty - 70) + 'px';
}

// === VERIFICAÇÃO DE IDENTIDADE — SÓ O EXATO PASSA ===
function ehIdentico(r, g, b) {
    if (!assinatura) return false;
    
    // VISÃO DIRETA — cor idêntica
    const direta = 
        Math.abs(r - assinatura.r) < TOLERANCIA_RIGIDA &&
        Math.abs(g - assinatura.g) < TOLERANCIA_RIGIDA &&
        Math.abs(b - assinatura.b) < TOLERANCIA_RIGIDA;
    
    // VISÃO PARCIAL — coberta mas reconhecível
    const parcial = 
        Math.abs(r - assinatura.r) < TOLERANCIA_COBERTA &&
        Math.abs(g - assinatura.g) < TOLERANCIA_COBERTA &&
        Math.abs(b - assinatura.b) < TOLERANCIA_COBERTA;
    
    return direta || parcial;
}

function mostrarResultado(tem) {
    resultado.style.display = 'block';
    
    if (tem) {
        resultado.className = 'resultado verde';
        resultado.textContent = '✅ ESTÁ AQUI!';
        statusIA.textContent = '🎯 CONFIRMADO — É ELA! IDENTIDADE EXATA!';
    } else {
        resultado.className = 'resultado vermelho';
        resultado.textContent = '❌ NÃO';
        statusIA.textContent = 'Não é a pedrinha — prossiga ao próximo';
    }
}

// === CONTROLE DE ANÁLISE ===
let analise = { positivos: 0, total: 0, decidido: false };

function analisar() {
    if (!ctx || !assinatura || fase !== 'busca') {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // ÁREA DE VISÃO — SEM LIMITE DE ALCANCE, MAS PRECISA
    const rectCam = cam.getBoundingClientRect();
    const qRect = visaoBionica.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((qRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((qRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(qRect.width * escalaW);
    const areaA = Math.floor(qRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    // === ESCANEIA SEM LIMITE DE PONTOS ===
    let pontosIguais = 0;
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehIdentico(dados[i], dados[i+1], dados[i+2])) {
                pontosIguais++;
            }
        }
    }
    
    // === DECISÃO — DIFERENCIA O CERTO DO ERRADO ===
    if (!analise.decidido) {
        analise.total++;
        
        if (pontosIguais >= LIMIAR_CONFIRMACAO) {
            analise.positivos++;
        }
        
        // Já tem dados suficientes? Decide!
        if (analise.total >= 50) {
            const proporcao = analise.positivos / analise.total;
            const temPedrinha = proporcao >= 0.25; // Padrão dela presente
            
            // SEGUNDA VERIFICAÇÃO — confirma antes de falar
            const confirmaFinal = analise.positivos >= LIMIAR_REJEICAO;
            
            if (temPedrinha && confirmaFinal) {
                mostrarResultado(true);
            } else {
                mostrarResultado(false);
            }
            
            analise.decidido = true;
            
            // LIBERA PARA PRÓXIMO COPO
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false };
                resultado.style.display = 'none';
                statusIA.textContent = 'Aponte para o próximo copo...';
            }, 2000);
        } else {
            statusIA.textContent = `👁️ Analisando... ${analise.total}/50 | Iguais: ${analise.positivos}`;
        }
    }
    
    requestAnimationFrame(analisar);
}

analisar();
</script>
</body>
</html>
