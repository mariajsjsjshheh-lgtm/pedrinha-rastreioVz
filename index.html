<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA RASTREIO REAL — SEM TRAVA, ONDE ESTIVER VAI 💎🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-varredura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 94%; height: 88%;
            border: 2px solid #00ffcc;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ffcc44;
            pointer-events: none;
            z-index: 5;
        }
        
        .linha-divisoria {
            position: absolute;
            top: 0; bottom: 0; left: 33.33%;
            width: 1px; background: #00ffcc22;
            z-index: 6; pointer-events: none;
        }
        .linha-divisoria2 {
            position: absolute;
            top: 0; bottom: 0; left: 66.66%;
            width: 1px; background: #00ffcc22;
            z-index: 6; pointer-events: none;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 32px; height: 32px;
            border: 3px solid #ffff00;
            border-radius: 50%;
            box-shadow: 
                0 0 18px #ffff00,
                0 0 35px #ffcc0066,
                inset 0 0 10px #ffffff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: pulso-forte 0.4s infinite alternate;
            transition: left 0.08s ease-out, top 0.08s ease-out;
            will-change: left, top;
        }
        
        .rotulo-pedrinha {
            position: absolute;
            background: linear-gradient(135deg, #ffff00, #ffcc00);
            color: #000;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 11px;
            pointer-events: none;
            display: none;
            z-index: 16;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        
        .luz-vermelha {
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #aa0000, #dd2222);
            color: #fff;
            border: 2px solid #ff5555;
            box-shadow: 0 0 15px #ff000044;
            display: none;
            z-index: 20;
        }
        
        .info-topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 30;
            text-align: center;
            border: 1px solid #00ffcc44;
            max-width: 92%;
        }
        
        .status-sistema {
            position: fixed;
            bottom: 90px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,30,40,0.85);
            color: #88ffcc;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 30;
            text-align: center;
            max-width: 90%;
            border: 1px solid #00ffcc33;
        }
        
        .botoes {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }
        
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.15s;
        }
        button:active { transform: scale(0.97); }
        
        #btnIniciar { 
            background: linear-gradient(135deg, #00cc00, #00ff00); 
            color: #000; 
            font-size: 17px;
            padding: 15px 35px;
        }
        #btnParar { 
            background: linear-gradient(135deg, #cc0000, #ff2222); 
            color: #fff; 
            display: none;
        }
        #btnReset { 
            background: linear-gradient(135deg, #333, #555); 
            color: #fff; 
            display: none;
        }
        
        .posicao-alvo {
            position: fixed;
            top: 65px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,25,15,0.85);
            color: #88ff88;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 30;
            border: 1px solid #00ff0033;
            text-align: center;
            max-width: 95%;
        }
        
        @keyframes pulso-forte {
            from { opacity: 0.9; transform: scale(1); }
            to { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-varredura" id="zonaVarredura"></div>
    <div class="linha-divisoria"></div>
    <div class="linha-divisoria2"></div>
    
    <div class="marcador-pedrinha" id="marcadorP"></div>
    <div class="rotulo-pedrinha" id="rotuloP">💎 ACHOU!</div>
    
    <div class="luz-vermelha" id="luzNao">❌ NÃO TEM</div>
    
    <div class="info-topo" id="infoTopo">
        🧠 RASTREIO REAL — ESQUERDA / MEIO / DIREITA → ONDE ESTIVER, VAI!
    </div>
    <div class="posicao-alvo" id="posicaoAlvo">
        Calibre → INICIAR → mostre cada copo
    </div>
    <div class="status-sistema" id="status">
        👁️ Passo 1: Mostre a pedrinha sozinha → Passo 2: INICIAR
    </div>
    
    <div class="botoes">
        <button id="btnIniciar">🚀 INICIAR RASTREIO</button>
        <button id="btnParar">⏹️ PARAR</button>
        <button id="btnReset">🔄 REINICIAR</button>
    </div>

<script>
// ==========================================================
// VERSÃO CORRIGIDA DEFINITIVAMENTE — SEM TRAVA NO MEIO
// ==========================================================
// ❌ REMOVIDO: Acumulação entre quadros que causava "meio" sempre
// ✅ NOVO: Cálculo INSTANTÂNEO — cada quadro calcula do zero
// ✅ NOVO: Detecção de região — ESQUERDA | MEIO | DIREITA separada
// ✅ NOVO: Limiar por região — NÃO mistura pontos de lados diferentes
// ✅ NOVO: Reinício INSTANTÂNEO ao trocar de copo
// ==========================================================

const cam = document.getElementById('cam');
const zonaVarredura = document.getElementById('zonaVarredura');
const marcadorP = document.getElementById('marcadorP');
const rotuloP = document.getElementById('rotuloP');
const luzNao = document.getElementById('luzNao');
const infoTopo = document.getElementById('infoTopo');
const posicaoAlvo = document.getElementById('posicaoAlvo');
const status = document.getElementById('status');
const btnIniciar = document.getElementById('btnIniciar');
const btnParar = document.getElementById('btnParar');
const btnReset = document.getElementById('btnReset');

let fase = 'calibracao';
let assinatura = null;
let ctx = null, quadro = null;
let rastreioAtivo = false;

// === PARÂMETROS ===
const TOL_RIGIDA = 14;
const TOL_MEDIA = 20;
const TOL_FLEX = 28;
const MIN_PONTOS_POR_REGIAO = 12;  // Mais pontos = mais certeza
const AMOSTRAS_POR_DECISAO = 20;   // Rápido, mas seguro

// === INICIAR CÂMERA ===
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        infoTopo.innerHTML = '✅ Câmera pronta — Mostre a PEDRINHA e clique INICIAR';
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === CALIBRAÇÃO ===
btnIniciar.onclick = () => {
    if (!ctx) return;
    
    if (fase === 'calibracao') {
        infoTopo.innerHTML = '📸 Capturando cor... Mantenha a pedrinha visível e centralizada';
        status.textContent = 'Calibrando...';
        btnIniciar.disabled = true;
        btnIniciar.style.opacity = '0.6';
        
        calibraCorPedrinha(() => {
            fase = 'varredura';
            rastreioAtivo = true;
            btnIniciar.style.display = 'none';
            btnParar.style.display = 'block';
            btnReset.style.display = 'block';
            infoTopo.innerHTML = '✅ PRONTO! Aponte os 3 copos — ESQUERDA ←→ DIREITA';
            status.textContent = 'Buscando...';
            analisar();
        });
    }
};

function calibraCorPedrinha(callback) {
    let rAcum = [], gAcum = [], bAcum = [];
    let quadros = 0;
    const total = 40;
    
    function coletar() {
        if (quadros >= total) {
            const r = Math.round(media(rAcum));
            const g = Math.round(media(gAcum));
            const b = Math.round(media(bAcum));
            
            assinatura = { r, g, b };
            posicaoAlvo.innerHTML = `🎯 Cor gravada: R${r} G${g} B${b}`;
            callback();
            return;
        }
        
        ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
        const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
        
        let sr = 0, sg = 0, sb = 0, n = 0;
        const centroX = quadro.width / 2;
        const centroY = quadro.height / 2;
        const raio = Math.min(quadro.width, quadro.height) * 0.2;
        
        for (let y = 0; y < quadro.height; y += 2) {
            for (let x = 0; x < quadro.width; x += 2) {
                const dx = x - centroX;
                const dy = y - centroY;
                if (dx*dx + dy*dy < raio*raio) {
                    const i = (y * quadro.width + x) * 4;
                    const r = dados[i], g = dados[i+1], b = dados[i+2];
                    if (r > g + 25 && r > b + 25 && r > 80) {
                        sr += r; sg += g; sb += b; n++;
                    }
                }
            }
        }
        
        if (n > 0) {
            rAcum.push(sr / n);
            gAcum.push(sg / n);
            bAcum.push(sb / n);
        }
        
        quadros++;
        status.textContent = `Calibrando... ${quadros}/${total}`;
        requestAnimationFrame(coletar);
    }
    coletar();
}

function media(arr) {
    return arr.reduce((a,b) => a + b, 0) / arr.length;
}

// === PARAR / REINICIAR ===
btnParar.onclick = () => {
    rastreioAtivo = false;
    btnParar.style.display = 'none';
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '▶️ CONTINUAR';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    infoTopo.innerHTML = '⏸️ Pausado';
    status.textContent = 'Pausado';
    esconderTudo();
};

btnReset.onclick = () => {
    fase = 'calibracao';
    rastreioAtivo = false;
    assinatura = null;
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '🚀 INICIAR RASTREIO';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    btnParar.style.display = 'none';
    btnReset.style.display = 'none';
    esconderTudo();
    infoTopo.innerHTML = '🧠 Reiniciado — Mostre a pedrinha e INICIE';
    posicaoAlvo.innerHTML = 'Calibre → INICIAR → mostre cada copo';
    status.textContent = 'Aguardando...';
};

// === DETECÇÃO DE COR ===
function ehPedrinha(r, g, b) {
    if (!assinatura) return false;
    
    const dr = Math.abs(r - assinatura.r);
    const dg = Math.abs(g - assinatura.g);
    const db = Math.abs(b - assinatura.b);
    
    const exata = dr < TOL_RIGIDA && dg < TOL_RIGIDA && db < TOL_RIGIDA;
    const meio = dr < TOL_MEDIA && dg < TOL_MEDIA && db < TOL_MEDIA;
    const reflexo = dr < TOL_FLEX && dg < TOL_FLEX && db < TOL_FLEX && r > assinatura.r * 0.85;
    
    // Predominância vermelha
    const predominante = r > g + 20 && r > b + 20;
    
    return ((exata || meio || reflexo) && predominante);
}

// === MOSTRA BOLINHA NO LADO CERTO ===
function mostrarPedrinha(x, y, larguraTela) {
    esconderTudo();
    
    const rectCam = cam.getBoundingClientRect();
    const tx = (x / quadro.width) * rectCam.width;
    const ty = (y / quadro.height) * rectCam.height;
    
    // Define lado com base na posição REAL detectada
    let lado, codigo;
    if (tx < rectCam.width * 0.333) {
        lado = '⬅️ ESQUERDA'; codigo = 'ESQ';
    } else if (tx < rectCam.width * 0.666) {
        lado = '➡️ MEIO'; codigo = 'MIO';
    } else {
        lado = '➡️ DIREITA'; codigo = 'DIR';
    }
    
    // Posiciona DIRETO — sem ajuste, sem desvio
    marcadorP.style.display = 'block';
    marcadorP.style.left = (tx - 16) + 'px';
    marcadorP.style.top = (ty - 16) + 'px';
    
    rotuloP.style.display = 'block';
    rotuloP.style.left = (tx - 40) + 'px';
    rotuloP.style.top = (ty - 55) + 'px';
    
    posicaoAlvo.innerHTML = `🎯 ${lado} | X:${Math.round(tx)}px | Alvo confirmado ✅`;
    status.textContent = `✅ PEDRINHA NO ${codigo}! Bolinha está em cima!`;
}

function mostrarNaoTem() {
    esconderTudo();
    luzNao.style.display = 'block';
    status.textContent = '❌ NÃO TEM — prossiga';
    posicaoAlvo.innerHTML = '🔍 Buscando...';
}

function esconderTudo() {
    marcadorP.style.display = 'none';
    rotuloP.style.display = 'none';
    luzNao.style.display = 'none';
}

// === CONTROLE DE DECISÃO POR REGIÃO ===
let estado = {
    contagem: 0,
    esqPts: 0, esqX: 0, esqY: 0,
    meioPts: 0, meioX: 0, meioY: 0,
    dirPts: 0, dirX: 0, dirY: 0,
    decidindo: false
};

// === CÉREBRO PRINCIPAL — LÓGICA NOVA ===
function analisar() {
    if (!rastreioAtivo || !ctx || !assinatura) {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // Divide em 3 regiões IGUAIS
    const terco = quadro.width / 3;
    
    // Zona de varredura completa
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaVarredura.getBoundingClientRect();
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    // Zera contagem do quadro ATUAL — NÃO acumula com anteriores
    let ePts = 0, eX = 0, eY = 0;
    let mPts = 0, mX = 0, mY = 0;
    let dPts = 0, dX = 0, dY = 0;
    
    // Varre e separa por região
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                if (x < terco) {
                    ePts++; eX += x; eY += y;
                } else if (x < terco * 2) {
                    mPts++; mX += x; mY += y;
                } else {
                    dPts++; dX += x; dY += y;
                }
            }
        }
    }
    
    // Acumula para decisão
    estado.contagem++;
    if (ePts >= MIN_PONTOS_POR_REGIAO) { estado.esqPts++; estado.esqX += eX/ePts; estado.esqY += eY/ePts; }
    if (mPts >= MIN_PONTOS_POR_REGIAO) { estado.meioPts++; estado.meioX += mX/mPts; estado.meioY += mY/mPts; }
    if (dPts >= MIN_PONTOS_POR_REGIAO) { estado.dirPts++; estado.dirX += dX/dPts; estado.dirY += dY/dPts; }
    
    posicaoAlvo.innerHTML = `🔍 ESQ:${estado.esqPts} | MEIO:${estado.meioPts} | DIR:${estado.dirPts} | ${estado.contagem}/${AMOSTRAS_POR_DECISAO}`;
    
    // HORA DE DECIDIR
    if (estado.contagem >= AMOSTRAS_POR_DECISAO && !estado.decidindo) {
        estado.decidindo = true;
        
        // Qual região tem MAIS confirmações?
        const maxPts = Math.max(estado.esqPts, estado.meioPts, estado.dirPts);
        const limiar = Math.floor(AMOSTRAS_POR_DECISAO * 0.35);
        
        if (maxPts >= limiar) {
            if (estado.esqPts === maxPts) {
                const cx = estado.esqX / estado.esqPts;
                const cy = estado.esqY / estado.esqPts;
                mostrarPedrinha(cx, cy, quadro.width);
            } else if (estado.meioPts === maxPts) {
                const cx = estado.meioX / estado.meioPts;
                const cy = estado.meioY / estado.meioPts;
                mostrarPedrinha(cx, cy, quadro.width);
            } else {
                const cx = estado.dirX / estado.dirPts;
                const cy = estado.dirY / estado.dirPts;
                mostrarPedrinha(cx, cy, quadro.width);
            }
        } else {
            mostrarNaoTem();
        }
        
        // Reinicia TUDO para o próximo copo — ZERA COMPLETAMENTE
        setTimeout(() => {
            estado = { contagem: 0, esqPts:0, esqX:0, esqY:0, meioPts:0, meioX:0, meioY:0, dirPts:0, dirX:0, dirY:0, decidindo: false };
            esconderTudo();
            status.textContent = 'Aponte para o próximo copo...';
        }, 2500);
    }
    
    requestAnimationFrame(analisar);
}
</script>
</body>
</html>
