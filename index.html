<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SEGUE PARA SEMPRE 🔒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; touch-action: none; }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* GOTINHA + CADEADO — FIXA PRA SEMPRE */
        .marcador {
            position: absolute;
            width: 56px; height: 70px;
            pointer-events: none;
            z-index: 100;
            display: none;
            transition: left 0.1s ease-out, top 0.1s ease-out;
            filter: drop-shadow(0 0 12px rgba(0, 150, 136, 0.9));
        }

        .gotinha { width: 100%; height: 100%; }

        .cadeado {
            position: absolute;
            bottom: -8px; left: 50%;
            transform: translateX(-50%);
            background: #009688;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .aviso {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 200;
            border: 2px solid #009688;
        }

        .botao {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #009688;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            z-index: 200;
        }
        .botao:active { transform: scale(0.96); }
        .botao.escondido { display: none; }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <div class="marcador" id="marcador">
        <svg class="gotinha" viewBox="0 0 52 64">
            <path d="M26 0 C26 0 0 24 0 42 C0 54 11.7 64 26 64 C40.3 64 52 54 52 42 C52 24 26 0 26 0 Z" 
                  fill="#009688" />
        </svg>
        <div class="cadeado">🔒 FIXADO</div>
    </div>

    <div class="aviso" id="aviso">
        👆 TOQUE NO COPO PARA FIXAR — NÃO PARA MAIS
    </div>

    <button class="botao" id="btnNovo">🔄 NOVO COPO</button>

<script>
// ==============================================================
// SÓ O QUE VOCÊ PEDIU — SEM INVENÇÃO, SEM BOTÃO DE PARAR
// ==============================================================
// ✅ Toque no copo → FIXA COM CADEADO 🔒
// ✅ Segue ele PARA SEMPRE — não para, não solta
// ✅ Move o copo → vai junto. Para → para. Embaralha → continua nele
// ✅ NÃO TEM botão de pausar/parar — só NOVO COPO pra trocar
// ✅ Não some, não solta, não abandona
// ==============================================================

const cam = document.getElementById('cam');
const marcador = document.getElementById('marcador');
const aviso = document.getElementById('aviso');
const btnNovo = document.getElementById('btnNovo');

let canvas, ctx;

const alvo = {
    fixado: false,
    x: 0, y: 0,
    cor: { r: 0, g: 0, b: 0, tol: 42 },
    ultImgX: 0, ultImgY: 0,
    raioBusca: 110,
    perdidos: 0,
    maxPerdidos: 200,
    suavX: 0, suavY: 0,
    fatorSuav: 0.18
};

// Liga câmera
navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: 1280, height: 720 }
}).then(fluxo => {
    cam.srcObject = fluxo;
    cam.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
    };
}).catch(() => alert('Permita a câmera! 📷'));

// Toque = fixa no copo
document.addEventListener('touchstart', fixar, { passive: false });
document.addEventListener('mousedown', fixar);

function fixar(e) {
    e.preventDefault();
    if (!canvas || alvo.fixado) return;

    let tx, ty;
    if (e.touches) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
    else { tx = e.clientX; ty = e.clientY; }

    const rect = cam.getBoundingClientRect();
    const imgX = (tx / rect.width) * canvas.width;
    const imgY = (ty / rect.height) * canvas.height;

    // Pega a cor do copo tocado
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let r=0, g=0, b=0, qt=0;
    for (let dy = -22; dy <= 22; dy += 2) {
        for (let dx = -22; dx <= 22; dx += 2) {
            const px = Math.round(imgX + dx);
            const py = Math.round(imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            const i = (py * canvas.width + px) * 4;
            r += imgData[i]; g += imgData[i+1]; b += imgData[i+2]; qt++;
        }
    }

    alvo.cor.r = Math.round(r/qt);
    alvo.cor.g = Math.round(g/qt);
    alvo.cor.b = Math.round(b/qt);

    alvo.x = tx; alvo.y = ty;
    alvo.suavX = tx; alvo.suavY = ty;
    alvo.ultImgX = imgX; alvo.ultImgY = imgY;
    alvo.perdidos = 0;
    alvo.fixado = true;

    marcador.style.display = 'block';
    posicao(tx, ty);
    aviso.textContent = '🔒 FIXADO PARA SEMPRE — Mova o copo!';
    btnNovo.classList.remove('escondido');

    seguir();
}

// Segue o copo o tempo todo
function seguir() {
    if (!alvo.fixado || !ctx) return;

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const rect = cam.getBoundingClientRect();

    const escalaX = canvas.width / rect.width;
    const escalaY = canvas.height / rect.height;

    // Busca perto de onde estava — não sai procurando outro
    const centroX = alvo.ultImgX;
    const centroY = alvo.ultImgY;
    let somaX = 0, somaY = 0, qt = 0;
    const raio = alvo.raioBusca;

    for (let dy = -raio; dy <= raio; dy += 2) {
        for (let dx = -raio; dx <= raio; dx += 2) {
            const px = Math.round(centroX + dx);
            const py = Math.round(centroY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > raio) continue;

            const i = (py * canvas.width + px) * 4;
            const r = imgData[i], g = imgData[i+1], b = imgData[i+2];

            const dr = Math.abs(r - alvo.cor.r);
            const dg = Math.abs(g - alvo.cor.g);
            const db = Math.abs(b - alvo.cor.b);

            if (dr < alvo.cor.tol && dg < alvo.cor.tol && db < alvo.cor.tol) {
                somaX += px;
                somaY += py;
                qt++;
            }
        }
    }

    if (qt >= 10) {
        // Achou — atualiza
        const novoImgX = somaX / qt;
        const novoImgY = somaY / qt;
        alvo.ultImgX = novoImgX;
        alvo.ultImgY = novoImgY;
        alvo.perdidos = 0;

        const novoX = (novoImgX / canvas.width) * rect.width;
        const novoY = (novoImgY / canvas.height) * rect.height;

        // Suaviza
        alvo.suavX = alvo.suavX * (1 - alvo.fatorSuav) + novoX * alvo.fatorSuav;
        alvo.suavY = alvo.suavY * (1 - alvo.fatorSuav) + novoY * alvo.fatorSuav;

        alvo.x = alvo.suavX;
        alvo.y = alvo.suavY;
        posicao(alvo.x, alvo.y);
    } else {
        // Não achou agora — espera, não solta
        alvo.perdidos++;
        if (alvo.perdidos < alvo.maxPerdidos) {
            // Mantém onde estava, continua procurando
        }
        // Não some, não para
    }

    requestAnimationFrame(seguir);
}

// Coloca a ponta da gotinha no copo
function posicao(px, py) {
    marcador.style.left = (px - 28) + 'px';
    marcador.style.top = (py - 64) + 'px';
}

// Trocar de copo — só isso
btnNovo.addEventListener('click', () => {
    alvo.fixado = false;
    marcador.style.display = 'none';
    btnNovo.classList.add('escondido');
    aviso.textContent = '👆 TOQUE NO NOVO COPO PARA FIXAR';
});
</script>
</body>
</html>
