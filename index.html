<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador Fiel 💎🔒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .marcador {
            position: absolute;
            width: 85px; height: 85px;
            border: 4px solid #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 25px #ffff00, 0 0 45px #ffd000aa;
            pointer-events: none;
            display: none;
            z-index: 10;
            transition: left 0.015s linear, top 0.015s linear;
            animation: pulso 0.5s infinite alternate;
        }
        
        .etiqueta {
            position: absolute;
            background: #ffff00;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            display: none;
            z-index: 11;
            transition: left 0.015s linear, top 0.015s linear;
            white-space: nowrap;
        }
        
        .botoes {
            position: fixed;
            bottom: 35px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex; gap: 12px;
        }
        
        button {
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        #btnLocalizar { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
        #btnParar { background: linear-gradient(135deg, #ff3333, #bb0000); color: #fff; display: none; }
        
        .status {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 20;
            text-align: center;
        }
        
        @keyframes pulso {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="marcador" id="marcador"></div>
    <div class="etiqueta" id="etiqueta">💎 MINHA PEDRINHA — SEMPRE A ELA!</div>
    
    <div class="status" id="status">📷 Permita a câmera → clique em LOCALIZAR e depois NA SUA pedrinha!</div>
    
    <div class="botoes">
        <button id="btnLocalizar">🎯 LOCALIZAR MINHA PEDRINHA</button>
        <button id="btnParar">🛑 PARAR</button>
    </div>

<script>
const cam = document.getElementById('cam');
const marcador = document.getElementById('marcador');
const etiqueta = document.getElementById('etiqueta');
const btnLocalizar = document.getElementById('btnLocalizar');
const btnParar = document.getElementById('btnParar');
const status = document.getElementById('status');

let rastreando = false;
let alvo = null;
let corReferencia = null;
let toleranciaCor = 35; // Mais rigoroso = menos confusão
let ctx = null;
let quadro = null;

// Ligar câmera em alta velocidade
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 720 },
        height: { ideal: 480 },
        frameRate: { ideal: 60 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        status.textContent = '✅ PRONTO! Clique em LOCALIZAR e depois NA SUA pedrinha!';
    };
}).catch(() => {
    status.textContent = '❌ Permita a câmera!';
    alert('Dê permissão à câmera! 📷');
});

btnLocalizar.onclick = () => {
    rastreando = true;
    btnLocalizar.style.display = 'none';
    btnParar.style.display = 'block';
    status.textContent = '👆 CLIQUE EXATAMENTE NA SUA PEDRINHA AGORA!';
};

// === MARCA A PEDRINHA E PEGA SUA ASSINATURA EXATA ===
cam.onclick = (e) => {
    if (!rastreando || !ctx) return;
    
    const rect = cam.getBoundingClientRect();
    const escalaX = quadro.width / rect.width;
    const escalaY = quadro.height / rect.height;
    
    const xTela = e.clientX - rect.left;
    const yTela = e.clientY - rect.top;
    const xQ = xTela * escalaX;
    const yQ = yTela * escalaY;
    
    // Captura a cor EXATA da pedrinha que VOCÊ escolheu
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    // Pega a cor de vários pontos ao redor pra ter média mais fiel
    let somaR = 0, somaG = 0, somaB = 0, pontos = 0;
    for (let dy = -3; dy <= 3; dy += 2) {
        for (let dx = -3; dx <= 3; dx += 2) {
            const d = ctx.getImageData((xQ + dx) | 0, (yQ + dy) | 0, 1, 1).data;
            somaR += d[0]; somaG += d[1]; somaB += d[2]; pontos++;
        }
    }
    
    corReferencia = {
        r: somaR / pontos,
        g: somaG / pontos,
        b: somaB / pontos
    };
    
    alvo = {
        x: xQ,
        y: yQ,
        vx: 0,
        vy: 0,
        confirmado: true
    };
    
    cam.onclick = null; // TRAVOU — só essa pedrinha agora!
    status.textContent = '🔒 PEDRINHA MARCADA! SÓ ELA SERÁ RASTREADA — NENHUMA OUTRA!';
};

btnParar.onclick = () => {
    rastreando = false;
    marcador.style.display = 'none';
    etiqueta.style.display = 'none';
    btnLocalizar.style.display = 'block';
    btnParar.style.display = 'none';
    status.textContent = '⏹️ Parado — clique de novo pra marcar';
    alvo = null;
    corReferencia = null;
};

function mostrar(x, y) {
    const rect = cam.getBoundingClientRect();
    const telaX = x / quadro.width * rect.width;
    const telaY = y / quadro.height * rect.height;
    
    marcador.style.display = 'block';
    etiqueta.style.display = 'block';
    
    marcador.style.left = (telaX - 42) + 'px';
    marcador.style.top = (telaY - 42) + 'px';
    
    etiqueta.style.left = (telaX - 80) + 'px';
    etiqueta.style.top = (telaY - 115) + 'px';
}

// === COMPARA COR — SÓ ACEITA A EXATA QUE VOCÊ MARCOU ===
function ehAPedrinha(r, g, b) {
    if (!corReferencia) return false;
    return Math.abs(r - corReferencia.r) < toleranciaCor &&
           Math.abs(g - corReferencia.g) < toleranciaCor &&
           Math.abs(b - corReferencia.b) < toleranciaCor;
}

// === O CÉREBRO — SEGUE ELA PRA QUALQUER LUGAR ===
function rastrear() {
    if (!rastreando || !alvo || !corReferencia || !ctx) {
        requestAnimationFrame(rastrear);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // Área de busca: EXPANDIU conforme a velocidade — não deixa escapar
    const velocidade = Math.hypot(alvo.vx, alvo.vy);
    const raioBusca = Math.max(80, 120 + velocidade * 3);
    
    let somaX = 0, somaY = 0, cont = 0;
    
    const minX = Math.max(0, alvo.x - raioBusca) | 0;
    const maxX = Math.min(quadro.width, alvo.x + raioBusca) | 0;
    const minY = Math.max(0, alvo.y - raioBusca) | 0;
    const maxY = Math.min(quadro.height, alvo.y + raioBusca) | 0;
    
    // SÓ PROCURA A PEDRINHA COM A COR EXATA — OUTRAS SÃO IGNORADAS COMPLETAMENTE
    for (let y = minY; y < maxY; y += 2) {
        for (let x = minX; x < maxX; x += 2) {
            const i = (y * quadro.width + x) * 4;
            const r = dados[i], g = dados[i+1], b = dados[i+2];
            
            if (ehAPedrinha(r, g, b)) {
                somaX += x;
                somaY += y;
                cont++;
            }
        }
    }
    
    if (cont >= 3) {
        // ENCONTROU A MINHA PEDRINHA! Atualiza posição RÁPIDO
        const novoX = somaX / cont;
        const novoY = somaY / cont;
        
        // Calcula velocidade real pra saber pra onde ela vai
        alvo.vx = (novoX - alvo.x) * 0.8;
        alvo.vy = (novoY - alvo.y) * 0.8;
        
        alvo.x = novoX;
        alvo.y = novoY;
    } else {
        // NÃO VIU MAS SABE PRA ONDE FOI → SEGUE A DIREÇÃO!
        alvo.x += alvo.vx;
        alvo.y += alvo.vy;
        
        // Se saiu da tela, reduz velocidade e continua procurando
        if (alvo.x < 0 || alvo.x > quadro.width || alvo.y < 0 || alvo.y > quadro.height) {
            alvo.vx *= 0.95;
            alvo.vy *= 0.95;
        }
    }
    
    mostrar(alvo.x, alvo.y);
    requestAnimationFrame(rastrear);
}

rastrear();
</script>
</body>
</html>
