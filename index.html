<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA DETETIVE DIRETO — SEM CALIBRAÇÃO 💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-busca {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 220px;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            box-shadow: 0 0 20px #00ffcc55;
            pointer-events: none;
            z-index: 5;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 52px; height: 52px;
            border: 4px solid #ffff00;
            border-radius: 50%;
            box-shadow: 
                0 0 18px #ffff00,
                0 0 35px #ffcc0088,
                inset 0 0 12px #ffffff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: brilho 0.45s infinite alternate;
        }
        
        .rotulo-pedrinha {
            position: absolute;
            background: #ffff00;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 16;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        
        .luz-vermelha {
            position: absolute;
            top: 24%; left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #cc0000, #ee2222);
            color: #fff;
            border: 3px solid #ff6666;
            box-shadow: 0 0 18px #ff000055;
            display: none;
            z-index: 20;
        }
        
        .info-topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 30;
            text-align: center;
            border: 1px solid #00ffcc44;
        }
        
        .status-sistema {
            position: fixed;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,20,20,0.85);
            color: #88ff88;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 30;
            text-align: center;
            max-width: 90%;
        }
        
        @keyframes brilho {
            from { opacity: 0.85; transform: scale(1); }
            to { opacity: 1; transform: scale(1.12); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-busca" id="zonaBusca"></div>
    
    <div class="marcador-pedrinha" id="marcadorP"></div>
    <div class="rotulo-pedrinha" id="rotuloP">💎 PEDRINHA AQUI</div>
    
    <div class="luz-vermelha" id="luzNao">❌ NÃO TEM</div>
    
    <div class="info-topo" id="infoTopo">
        🤖 SISTEMA ATIVO — APONTE DIRETO NOS COPOS
    </div>
    <div class="status-sistema" id="status">
        👁️ Analisando... aponte devagar em cada copo
    </div>

<script>
// ==========================================================
// FINAL — SEM CALIBRAÇÃO, SEM MOSTRAR ANTES, SEM BOTÃO
// APONTA → IA DESCOBRE → MOSTRA
// ==========================================================
// ✅ TIRADO: mostrar pedrinha antes de começar
// ✅ TIRADO: qualquer botão ou passo manual
// ✅ IA já sabe o que buscar, já começa trabalhando
// ✅ Só 1 copo mostra a pedrinha — os outros = luz vermelha pequena
// ✅ Você VÊ a pedrinha marcada no copo certo
// ==========================================================

const cam = document.getElementById('cam');
const zonaBusca = document.getElementById('zonaBusca');
const marcadorP = document.getElementById('marcadorP');
const rotuloP = document.getElementById('rotuloP');
const luzNao = document.getElementById('luzNao');
const infoTopo = document.getElementById('infoTopo');
const status = document.getElementById('status');

let ctx = null, quadro = null;

// === COR DA PEDRINHA — JÁ DEFINIDA, NÃO PRECISA MOSTRAR ===
// Se a pedrinha for VERMELHA: [200, 40, 40]
// Se for VERDE: [30, 180, 60]
// Se for outra cor, me fala que troco!
const COR_ALVO = { r: 200, g: 40, b: 40 }; // ← PADRÃO VERMELHO
const PREDOMINANCIA = 'r'; // 'r'=vermelho é o mais forte | 'g'=verde

const TOLERANCIA_RIGIDA = 14;
const TOLERANCIA_FLEX = 22;
const MIN_PONTOS = 18;
const MIN_CONFIRMA = 8;
const AMOSTRAS_DECISAO = 35;

// === INICIAR CÂMERA E JÁ COMEÇAR — SEM ESPERAR ===
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        infoTopo.innerHTML = '✅ SISTEMA PRONTO — Aponte nos copos';
        analisar(); // JÁ COMEÇA DIRETO!
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === RECONHECE A PEDRINHA PELA COR DEFINIDA ===
function ehPedrinha(r, g, b) {
    const dr = Math.abs(r - COR_ALVO.r);
    const dg = Math.abs(g - COR_ALVO.g);
    const db = Math.abs(b - COR_ALVO.b);
    
    const exato = dr < TOLERANCIA_RIGIDA &&
                  dg < TOLERANCIA_RIGIDA &&
                  db < TOLERANCIA_RIGIDA;
    
    const proximo = dr < TOLERANCIA_FLEX &&
                    dg < TOLERANCIA_FLEX &&
                    db < TOLERANCIA_FLEX;
    
    // Garante que a cor alvo é a mais forte
    let predominante = false;
    if (PREDOMINANCIA === 'r') {
        predominante = r > g + 20 && r > b + 20;
    } else if (PREDOMINANCIA === 'g') {
        predominante = g > r + 20 && g > b + 20;
    }
    
    return (exato || proximo) && predominante;
}

// === MOSTRA PEDRINHA MARCADA DENTRO DO COPO ===
function mostrarPedrinha(x, y) {
    esconderTudo();
    
    const rectCam = cam.getBoundingClientRect();
    const tx = (x / quadro.width) * rectCam.width;
    const ty = (y / quadro.height) * rectCam.height;
    
    marcadorP.style.display = 'block';
    marcadorP.style.left = (tx - 26) + 'px';
    marcadorP.style.top = (ty - 26) + 'px';
    
    rotuloP.style.display = 'block';
    rotuloP.style.left = (tx - 55) + 'px';
    rotuloP.style.top = (ty - 75) + 'px';
    
    status.textContent = '🎯 PEDRINHA DETECTADA — veja marcada acima!';
}

// === LUZ VERMELHA PEQUENA ===
function mostrarNaoTem() {
    esconderTudo();
    luzNao.style.display = 'block';
    status.textContent = '❌ NÃO TEM — prossiga';
}

function esconderTudo() {
    marcadorP.style.display = 'none';
    rotuloP.style.display = 'none';
    luzNao.style.display = 'none';
}

// === CONTROLE DE DECISÃO ===
let analise = {
    positivos: 0,
    total: 0,
    decidido: false,
    somaX: 0,
    somaY: 0,
    qtdPontos: 0
};

// === CÉREBRO — RODA SEM PARAR, SEM CALIBRAÇÃO ===
function analisar() {
    if (!ctx) {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // Área focada no copo
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaBusca.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    let encontrados = 0;
    let somaX = 0, somaY = 0;
    
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                encontrados++;
                somaX += x;
                somaY += y;
            }
        }
    }
    
    if (!analise.decidido) {
        analise.total++;
        
        if (encontrados >= MIN_PONTOS) {
            analise.positivos++;
            analise.somaX += somaX;
            analise.somaY += somaY;
            analise.qtdPontos += encontrados;
        }
        
        if (analise.total >= AMOSTRAS_DECISAO) {
            const confiavel = analise.positivos / analise.total >= 0.30 &&
                             analise.positivos >= MIN_CONFIRMA;
            
            if (confiavel) {
                const cx = analise.somaX / analise.qtdPontos;
                const cy = analise.somaY / analise.qtdPontos;
                mostrarPedrinha(cx, cy);
            } else {
                mostrarNaoTem();
            }
            
            analise.decidido = true;
            
            // Libera sozinho pro próximo copo
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false, somaX: 0, somaY: 0, qtdPontos: 0 };
                esconderTudo();
                status.textContent = 'Aponte para o próximo copo...';
            }, 2500);
        } else {
            status.textContent = `Analisando... ${analise.total}/${AMOSTRAS_DECISAO}`;
        }
    }
    
    requestAnimationFrame(analisar);
}
</script>
</body>
</html>
