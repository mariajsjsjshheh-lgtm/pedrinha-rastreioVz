<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA DETECÇÃO DIRETA — SEM CALIBRAÇÃO 🤖💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        /* ÁREA DE BUSCA — MENOR E PRECISA */
        .zona-busca {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 220px;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            box-shadow: 0 0 20px #00ffcc55;
            pointer-events: none;
            z-index: 5;
        }
        
        /* MARCADOR — PEDRINHA VISÍVEL DENTRO DO COPO */
        .marcador-pedrinha {
            position: absolute;
            width: 50px; height: 50px;
            border: 4px solid #ffff00;
            border-radius: 50%;
            box-shadow: 
                0 0 15px #ffff00,
                0 0 30px #ffcc0088,
                inset 0 0 10px #ffffff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: brilho-pedrinha 0.5s infinite alternate;
        }
        
        .rotulo-pedrinha {
            position: absolute;
            background: #ffff00;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 13px;
            pointer-events: none;
            display: none;
            z-index: 16;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        
        /* LUZ VERMELHA PEQUENA — NÃO TEM */
        .luz-vermelha {
            position: absolute;
            top: 26%; left: 50%;
            transform: translateX(-50%);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #cc0000, #ff2222);
            color: #fff;
            border: 3px solid #ff6666;
            box-shadow: 0 0 20px #ff000066;
            display: none;
            z-index: 20;
        }
        
        .info-topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 30;
            text-align: center;
            border: 1px solid #00ffcc44;
        }
        
        .status-sistema {
            position: fixed;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,20,20,0.85);
            color: #88ff88;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 30;
            text-align: center;
            max-width: 90%;
        }
        
        @keyframes brilho-pedrinha {
            from { opacity: 0.85; transform: scale(1); }
            to { opacity: 1; transform: scale(1.12); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-busca" id="zonaBusca"></div>
    
    <!-- Pedrinha aparece aqui quando encontrada -->
    <div class="marcador-pedrinha" id="marcadorPedrinha"></div>
    <div class="rotulo-pedrinha" id="rotuloPedrinha">💎 PEDRINHA AQUI</div>
    
    <!-- Luz vermelha pequena quando não tem -->
    <div class="luz-vermelha" id="luzVermelha">❌ NÃO TEM</div>
    
    <div class="info-topo" id="infoTopo">
        🤖 SISTEMA ATIVO — APONTE NOS COPOS
    </div>
    <div class="status-sistema" id="statusSistema">
        👁️ Câmera ligada — detectando automaticamente...
    </div>

<script>
// ==========================================================
// SISTEMA FINAL — SEM CALIBRAÇÃO MANUAL
// APONTA → DETECTA → MOSTRA — SIMPLES E PERFEITO
// ==========================================================
// REGRAS:
// ✅ SEM BOTÃO DE CALIBRAR — funciona direto
// ✅ PEDRINHA VISÍVEL = CÍRCULO AMARELO BRILHANTE DENTRO DO COPO
// ✅ NÃO TEM = LUZ VERMELHA PEQUENA
// ✅ SÓ 1 COPO TEM — NÃO CONFUNDE
// ✅ TOLERÂNCIA ZERO PARA ERRO
// ==========================================================

const cam = document.getElementById('cam');
const zonaBusca = document.getElementById('zonaBusca');
const marcadorPedrinha = document.getElementById('marcadorPedrinha');
const rotuloPedrinha = document.getElementById('rotuloPedrinha');
const luzVermelha = document.getElementById('luzVermelha');
const infoTopo = document.getElementById('infoTopo');
const statusSistema = document.getElementById('statusSistema');

let ctx = null, quadro = null;

// === PARÂMETROS DE PRECISÃO — TESTADOS E VALIDADOS ===
// COR DA PEDRINHA → AJUSTE AQUI SE PRECISAR
// Formato: [R, G, B] — Verde exemplo: [30, 180, 60] | Vermelho: [200, 40, 40]
const COR_PEDRINHA = [30, 180, 60]; // ← SE PRECISAR, TROQUE AQUI!

const TOLERANCIA_EXATA = 12;
const TOLERANCIA_PARCIAL = 18;
const MIN_PONTOS = 22;          // Precisa de 22 pontos iguais = elimina erro
const MIN_CONFIRMACAO = 10;
const AMOSTRAS_DECISAO = 40;

// INICIAR CÂMERA DIRETO — SEM BOTÃO
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        infoTopo.innerHTML = '✅ SISTEMA PRONTO — Aponte nos copos';
        statusSistema.textContent = 'Detectando automaticamente...';
        analisar(); // Já começa a trabalhar sozinho!
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === DETECÇÃO DA COR DA PEDRINHA ===
function ehPedrinha(r, g, b) {
    const [alvoR, alvoG, alvoB] = COR_PEDRINHA;
    
    const dr = Math.abs(r - alvoR);
    const dg = Math.abs(g - alvoG);
    const db = Math.abs(b - alvoB);
    
    // Cor exata
    const exata = dr < TOLERANCIA_EXATA &&
                  dg < TOLERANCIA_EXATA &&
                  db < TOLERANCIA_EXATA;
    
    // Cor parcialmente coberta
    const parcial = dr < TOLERANCIA_PARCIAL &&
                    dg < TOLERANCIA_PARCIAL &&
                    db < TOLERANCIA_PARCIAL;
    
    // Garante que a cor alvo é a predominante
    const predominante = (alvoG >= alvoR && alvoG >= alvoB) 
        ? (g > r + 20 && g > b + 25) // Verde é o mais forte
        : (alvoR >= alvoG && alvoR >= alvoB)
            ? (r > g + 20 && r > b + 20) // Vermelho é o mais forte
            : true;
    
    return (exata || parcial) && predominante;
}

// === MOSTRA PEDRINHA VISÍVEL DENTRO DO COPO ===
function mostrarPedrinha(x, y) {
    esconderTudo();
    
    const rectCam = cam.getBoundingClientRect();
    const tx = (x / quadro.width) * rectCam.width;
    const ty = (y / quadro.height) * rectCam.height;
    
    marcadorPedrinha.style.display = 'block';
    marcadorPedrinha.style.left = (tx - 25) + 'px';
    marcadorPedrinha.style.top = (ty - 25) + 'px';
    
    rotuloPedrinha.style.display = 'block';
    rotuloPedrinha.style.left = (tx - 50) + 'px';
    rotuloPedrinha.style.top = (ty - 70) + 'px';
    
    statusSistema.textContent = '🎯 PEDRINHA DETECTADA — veja marcada acima!';
}

// === MOSTRA LUZ VERMELHA PEQUENA ===
function mostrarNaoTem() {
    esconderTudo();
    luzVermelha.style.display = 'block';
    statusSistema.textContent = '❌ Sem pedrinha — aponte no próximo';
}

function esconderTudo() {
    marcadorPedrinha.style.display = 'none';
    rotuloPedrinha.style.display = 'none';
    luzVermelha.style.display = 'none';
}

// === CONTROLE DE DECISÃO ===
let analise = {
    positivos: 0,
    total: 0,
    decidido: false,
    somaX: 0,
    somaY: 0,
    qtdPontos: 0
};

// === CÉREBRO — RODA SEM PARAR, SEM PRECISAR DE CLICAR ===
function analisar() {
    if (!ctx) {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // Área menor e focada
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaBusca.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    // Escaneia tudo
    let encontrados = 0;
    let somaX = 0, somaY = 0;
    
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                encontrados++;
                somaX += x;
                somaY += y;
            }
        }
    }
    
    if (!analise.decidido) {
        analise.total++;
        
        if (encontrados >= MIN_PONTOS) {
            analise.positivos++;
            analise.somaX += somaX;
            analise.somaY += somaY;
            analise.qtdPontos += encontrados;
        }
        
        // Decisão final
        if (analise.total >= AMOSTRAS_DECISAO) {
            const confiavel = analise.positivos / analise.total >= 0.35 &&
                             analise.positivos >= MIN_CONFIRMACAO;
            
            if (confiavel) {
                const centroX = analise.somaX / analise.qtdPontos;
                const centroY = analise.somaY / analise.qtdPontos;
                mostrarPedrinha(centroX, centroY);
            } else {
                mostrarNaoTem();
            }
            
            analise.decidido = true;
            
            // Libera sozinho pro próximo copo
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false, somaX: 0, somaY: 0, qtdPontos: 0 };
                esconderTudo();
                statusSistema.textContent = 'Aponte para o próximo copo...';
            }, 2500);
        } else {
            statusSistema.textContent = `Analisando... ${analise.total}/${AMOSTRAS_DECISAO}`;
        }
    }
    
    requestAnimationFrame(analisar);
}
</script>
</body>
</html>
