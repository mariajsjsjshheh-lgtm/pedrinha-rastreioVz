<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEGUE CERTO — NÃO PARA ✅</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    .cobertura {
        position: absolute;
        pointer-events: none;
        z-index: 50;
        display: none;
        border-radius: 8px;
        opacity: 0.95;
        box-shadow: 0 0 35px currentColor;
        transition: none;
        will-change: left, top;
    }

    .roxo { background: #9933ff; color: #9933ff; }
    .preto { 
        background: #111; color: #ff3333; 
        border: 3px solid #ff3333; 
        box-shadow: 0 0 20px #ff3333, 0 0 35px currentColor;
    }
    .amarelo { background: #ffcc00; color: #ffcc00; }

    .etiqueta {
        position: absolute;
        top: -24px; left: 50%;
        transform: translateX(-50%);
        color: white; font-size: 12px; font-weight: 900;
        padding: 4px 12px; border-radius: 12px; white-space: nowrap;
    }
    .roxo .etiqueta { background: #9933ff; }
    .preto .etiqueta { background: #ff3333; }
    .amarelo .etiqueta { background: #ffcc00; color: #000; }

    .aviso {
        position: fixed; top: 12px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.9); color: white;
        padding: 14px 24px; border-radius: 30px; font-size: 14px;
        z-index: 200; border: 2px solid #ff3333; text-align: center; max-width: 95%;
    }

    .botoes {
        position: fixed; bottom: 25px; left: 50%;
        transform: translateX(-50%); display: flex; gap: 10px; flex-wrap: wrap;
        justify-content: center; z-index: 200;
    }

    button {
        padding: 14px 22px; font-size: 14px; font-weight: bold;
        border: none; border-radius: 50px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }

    #btnMarcar { background: #ff3333; color: white; }
    #btnReligar { background: #ff4444; color: white; }
    #btnReiniciar { background: #009688; color: white; display: none; }
</style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>

    <div class="cobertura roxo" id="cRoxo">
        <div class="etiqueta">🟣 ROXO</div>
    </div>
    <div class="cobertura preto" id="cPreto">
        <div class="etiqueta">⚫ PEDRINHA</div>
    </div>
    <div class="cobertura amarelo" id="cAmarelo">
        <div class="etiqueta">🟡 AMARELO</div>
    </div>

    <div class="aviso" id="aviso">
        👆 TOQUE NO COPO — SEGUE SEM PARAR!
    </div>

    <div class="botoes">
        <button id="btnMarcar">🎯 MARCAR PEDRINHA</button>
        <button id="btnReligar">📷 RELIGAR CÂMERA</button>
        <button id="btnReiniciar">🔄 REINICIAR</button>
    </div>

<script>
const cam = document.getElementById('cam');
const cRoxo = document.getElementById('cRoxo');
const cPreto = document.getElementById('cPreto');
const cAmarelo = document.getElementById('cAmarelo');
const aviso = document.getElementById('aviso');
const btnMarcar = document.getElementById('btnMarcar');
const btnReligar = document.getElementById('btnReligar');
const btnReiniciar = document.getElementById('btnReiniciar');

let canvas, ctx;
let streamAtual = null;

const alvo = {
    marcado: false,
    pedrinha: { r: 220, g: 40, b: 40, tol: 55 },
    x: 0, y: 0, imgX: 0, imgY: 0,
    raioBusca: 280, // MAIS AMPLO — não perde
    distanciaMudar: 80, // MAIS SENSÍVEL — muda rápido
    perdidos: 0,
    maxPerdidos: 60,
    raioIgnorarDedo: 45,
    ultimoX: 0, ultimoY: 0
};

// MARCADORES MAIS BAIXOS ✅
const coberturas = [
    { el: cRoxo, w: 75, h: 105, deslX: -95, deslY: 35 },
    { el: cPreto, w: 85, h: 110, deslX: 0, deslY: 40 },
    { el: cAmarelo, w: 75, h: 105, deslX: 95, deslY: 35 }
];

async function ligarCamera() {
    try {
        if (streamAtual) streamAtual.getTracks().forEach(t => t.stop());
        streamAtual = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 1280, min: 640 },
                height: { ideal: 720, min: 480 },
                frameRate: { ideal: 30, min: 24 }
            },
            audio: false
        });
        cam.srcObject = streamAtual;
        await new Promise(res => cam.onloadedmetadata = res);
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
        aviso.innerHTML = '✅ PRONTO! Toque no copo!';
    } catch (erro) { alert('Permita a câmera! 📷'); }
}

let toqueX = -9999, toqueY = -9999;

function marcarPedrinha(e) {
    e.preventDefault();
    if (!canvas || alvo.marcado) return;

    const t = e.touches ? e.touches[0] : e;
    const rect = cam.getBoundingClientRect();

    toqueX = (t.clientX / rect.width) * canvas.width;
    toqueY = (t.clientY / rect.height) * canvas.height;

    alvo.x = t.clientX;
    alvo.y = t.clientY;
    alvo.imgX = toqueX;
    alvo.imgY = toqueY;
    alvo.ultimoX = toqueX;
    alvo.ultimoY = toqueY;
    alvo.marcado = true;
    alvo.perdidos = 0;

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let r = 0, g = 0, b = 0, q = 0;

    for (let dy = -55; dy <= 55; dy += 2) {
        for (let dx = -55; dx <= 55; dx += 2) {
            const px = Math.round(alvo.imgX + dx);
            const py = Math.round(alvo.imgY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            const dist = Math.hypot(dx, dy);
            if (dist < alvo.raioIgnorarDedo || dist > 55) continue;

            const i = (py * canvas.width + px) * 4;
            r += dados[i]; g += dados[i+1]; b += dados[i+2]; q++;
        }
    }

    if (q >= 5) {
        alvo.pedrinha.r = Math.round(r / q);
        alvo.pedrinha.g = Math.round(g / q);
        alvo.pedrinha.b = Math.round(b / q);
    }

    coberturas.forEach(c => c.el.style.display = 'block');
    aviso.innerHTML = '✅ SEGUINDO! Não para mais!';
    btnMarcar.disabled = true;
    btnReiniciar.style.display = 'block';
    btnReligar.style.display = 'none';

    rastrear();
}

function rastrear() {
    if (!alvo.marcado || !canvas) return requestAnimationFrame(rastrear);

    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const dados = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const rect = cam.getBoundingClientRect();

    // 🎯 BUSCA AO REDOR DO ÚLTIMO PONTO — SEMPRE SEGUE
    let somaX = 0, somaY = 0, q = 0;

    for (let dy = -alvo.raioBusca; dy <= alvo.raioBusca; dy += 2) {
        for (let dx = -alvo.raioBusca; dx <= alvo.raioBusca; dx += 2) {
            const px = Math.round(alvo.ultimoX + dx);
            const py = Math.round(alvo.ultimoY + dy);
            if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
            if (Math.hypot(dx, dy) > alvo.raioBusca) continue;

            if (Math.hypot(px - toqueX, py - toqueY) < alvo.raioIgnorarDedo * 0.7) continue;

            const i = (py * canvas.width + px) * 4;
            const dr = Math.abs(dados[i] - alvo.pedrinha.r);
            const dg = Math.abs(dados[i+1] - alvo.pedrinha.g);
            const db = Math.abs(dados[i+2] - alvo.pedrinha.b);

            if (dr < alvo.pedrinha.tol && dg < alvo.pedrinha.tol && db < alvo.pedrinha.tol) {
                somaX += px; somaY += py; q++;
            }
        }
    }

    if (q >= 3) {
        // ✅ ACHOU — VAI DIRETO, SEM TRAVAR!
        const novoX = somaX / q;
        const novoY = somaY / q;

        // 📏 Se afastou → muda de copo direto
        const dist = Math.hypot(novoX - alvo.ultimoX, novoY - alvo.ultimoY);
        if (dist > alvo.distanciaMudar) {
            alvo.ultimoX = novoX;
            alvo.ultimoY = novoY;
        } else {
            // Fica suave, segue o movimento
            alvo.ultimoX = alvo.ultimoX * 0.7 + novoX * 0.3;
            alvo.ultimoY = alvo.ultimoY * 0.7 + novoY * 0.3;
        }

        alvo.imgX = alvo.ultimoX;
        alvo.imgY = alvo.ultimoY;
        alvo.perdidos = 0;

    } else {
        alvo.perdidos++;
        // 🔍 Perdeu? Continua procurando, NÃO PARA!
        if (alvo.perdidos > 30) {
            const buscaTotal = 450;
            let achouX = 0, achouY = 0, achouQ = 0;
            
            for (let dy = -buscaTotal; dy <= buscaTotal; dy += 3) {
                for (let dx = -buscaTotal; dx <= buscaTotal; dx += 3) {
                    const px = Math.round(alvo.ultimoX + dx);
                    const py = Math.round(alvo.ultimoY + dy);
                    if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
                    if (Math.hypot(dx, dy) > buscaTotal) continue;
                    
                    const i = (py * canvas.width + px) * 4;
                    const dr = Math.abs(dados[i] - alvo.pedrinha.r);
                    const dg = Math.abs(dados[i+1] - alvo.pedrinha.g);
                    const db = Math.abs(dados[i+2] - alvo.pedrinha.b);
                    
                    if (dr < alvo.pedrinha.tol && dg < alvo.pedrinha.tol && db < alvo.pedrinha.tol) {
                        achouX += px; achouY += py; achouQ++;
                    }
                }
            }
            
            if (achouQ >= 3) {
                // ✅ REENCONTROU! VAI DIRETO!
                alvo.ultimoX = achouX / achouQ;
                alvo.ultimoY = achouY / achouQ;
                alvo.imgX = alvo.ultimoX;
                alvo.imgY = alvo.ultimoY;
                alvo.perdidos = 0;
            }
        }
        // Se não achou, NÃO PARA — mantém posição esperando
    }

    // Posição final
    alvo.x = (alvo.imgX / canvas.width) * rect.width;
    alvo.y = (alvo.imgY / canvas.height) * rect.height;

    // ✅ MARCADORES MAIS BAIXOS E JUNTOS
    coberturas.forEach(c => {
        c.el.style.width = c.w + 'px';
        c.el.style.height = c.h + 'px';
        c.el.style.left = (alvo.x - c.w / 2 + c.deslX) + 'px';
        c.el.style.top = (alvo.y - c.h / 2 + c.deslY) + 'px';
    });

    requestAnimationFrame(rastrear);
}

document.addEventListener('touchstart', marcarPedrinha, { passive: false });
document.addEventListener('mousedown', marcarPedrinha);

btnReiniciar.onclick = () => {
    alvo.marcado = false;
    toqueX = toqueY = -9999;
    coberturas.forEach(c => c.el.style.display = 'none');
    btnMarcar.disabled = false;
    btnReiniciar.style.display = 'none';
    btnReligar.style.display = 'block';
    aviso.innerHTML = '👆 TOQUE NO COPO COM A PEDRINHA';
};

ligarCamera();
</script>
</body>
</html>
