<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINAL — ONDE ESTIVER, VAI! 💎🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .bolinha {
            position: absolute;
            width: 40px; height: 40px;
            background: radial-gradient(circle, #ffff00, #ffcc00);
            border-radius: 50%;
            box-shadow: 0 0 25px #ffff00, 0 0 50px #ffcc00;
            display: none;
            z-index: 99;
            transition: left 0.05s linear, top 0.05s linear;
        }
        
        .info {
            position: fixed;
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 12px 20px;
            border-radius: 30px; font-size: 14px; z-index: 100; text-align: center;
        }
        
        .pos {
            position: fixed;
            top: 65px; left: 50%; transform: translateX(-50%);
            background: rgba(20,40,20,0.9); color: #8f8; padding: 8px 15px;
            border-radius: 20px; font-size: 12px; z-index: 100;
        }
        
        .botoes {
            position: fixed;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 15px;
        }
        
        button {
            padding: 15px 35px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer;
        }
        #btnIniciar { background: #0f0; color: #000; }
        #btnParar { background: #f33; color: #fff; display: none; }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    <div class="bolinha" id="bolinha"></div>
    
    <div class="info" id="info">📷 Dando permissão à câmera...</div>
    <div class="pos" id="pos">Aguardando...</div>
    
    <div class="botoes">
        <button id="btnIniciar">🎯 CALIBRAR E RASTREAR</button>
        <button id="btnParar">⏹️ PARAR</button>
    </div>

<script>
// ==========================================================
// VERSÃO ABSOLUTAMENTE SIMPLES — SEM TRUQUES, SEM MÉDIA FORÇADA
// ==========================================================
// REGRA ÚNICA: ONDE A COR APARECER, LÁ VAI A BOLINHA
// NENHUM CÓDIGO MEXE NA POSIÇÃO — É O QUE É DETECTADO
// ==========================================================

const cam = document.getElementById('cam');
const bolinha = document.getElementById('bolinha');
const info = document.getElementById('info');
const pos = document.getElementById('pos');
const btnIniciar = document.getElementById('btnIniciar');
const btnParar = document.getElementById('btnParar');

let alvo = null;
let ctx = null, canvas = null;
let rodando = false;

// Câmera
navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'environment', width: 1280, height: 720 }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
        info.innerHTML = '✅ Pronto! Mostre a pedrinha e clique o botão';
    };
}).catch(e => {
    info.innerHTML = '❌ Permita a câmera!';
    alert('Dê permissão para a câmera funcionar!');
});

// Calibrar
btnIniciar.onclick = () => {
    if (!ctx) return;
    info.innerHTML = '📸 Calibrando... Mantenha a pedrinha no CENTRO da tela!';
    
    // Captura a cor do centro da tela
    setTimeout(() => {
        ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        
        // Pega a cor do centro da tela
        const cx = Math.floor(canvas.width / 2);
        const cy = Math.floor(canvas.height / 2);
        let rTotal = 0, gTotal = 0, bTotal = 0, qt = 0;
        
        // Amostra uma área ao redor do centro
        for (let dy = -30; dy <= 30; dy += 3) {
            for (let dx = -30; dx <= 30; dx += 3) {
                const x = cx + dx;
                const y = cy + dy;
                const i = (y * canvas.width + x) * 4;
                rTotal += img[i];
                gTotal += img[i+1];
                bTotal += img[i+2];
                qt++;
            }
        }
        
        alvo = {
            r: Math.round(rTotal / qt),
            g: Math.round(gTotal / qt),
            b: Math.round(bTotal / qt),
            tol: 25  // Ajuste fino de sensibilidade
        };
        
        info.innerHTML = `✅ Cor capturada! R:${alvo.r} G:${alvo.g} B:${alvo.b}`;
        pos.innerHTML = '🎯 Rastreando... Mova a pedrinha!';
        
        btnIniciar.style.display = 'none';
        btnParar.style.display = 'block';
        rodando = true;
        rastrear();
    }, 800);
};

btnParar.onclick = () => {
    rodando = false;
    bolinha.style.display = 'none';
    btnParar.style.display = 'none';
    btnIniciar.style.display = 'block';
    info.innerHTML = '⏹️ Parado — clique para recomeçar';
    pos.innerHTML = 'Aguardando...';
};

// Função de comparação de cor
function ehIgual(r, g, b) {
    if (!alvo) return false;
    const dr = Math.abs(r - alvo.r);
    const dg = Math.abs(g - alvo.g);
    const db = Math.abs(b - alvo.b);
    return dr < alvo.tol && dg < alvo.tol && db < alvo.tol;
}

// RASTREIO — PURO, SEM MANIPULAÇÃO
function rastrear() {
    if (!rodando || !ctx || !alvo) return requestAnimationFrame(rastrear);
    
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    
    let somaX = 0, somaY = 0, qt = 0;
    
    // VARRE TELA INTEIRA — onde achar a cor, soma a posição
    for (let y = 0; y < canvas.height; y += 2) {
        for (let x = 0; x < canvas.width; x += 2) {
            const i = (y * canvas.width + x) * 4;
            if (ehIgual(img[i], img[i+1], img[i+2])) {
                somaX += x;
                somaY += y;
                qt++;
            }
        }
    }
    
    if (qt > 30) {
        // CENTRO REAL — média de TODOS os pontos encontrados
        const centroX = somaX / qt;
        const centroY = somaY / qt;
        
        // Converte para posição na tela
        const rect = cam.getBoundingClientRect();
        const px = (centroX / canvas.width) * rect.width;
        const py = (centroY / canvas.height) * rect.height;
        
        // MOSTRA — SEM AJUSTE, SEM DESVIO, SEM TRAVA
        bolinha.style.display = 'block';
        bolinha.style.left = (px - 20) + 'px';
        bolinha.style.top = (py - 20) + 'px';
        
        // Lado
        let lado = '';
        if (px < rect.width * 0.33) lado = '⬅️ ESQUERDA';
        else if (px < rect.width * 0.66) lado = '➡️ MEIO';
        else lado = '➡️ DIREITA';
        
        pos.innerHTML = `${lado} | X:${Math.round(px)} | Pontos:${qt}`;
    } else {
        bolinha.style.display = 'none';
        pos.innerHTML = '🔍 Pedrinha não visível...';
    }
    
    requestAnimationFrame(rastrear);
}
</script>
</body>
</html>
