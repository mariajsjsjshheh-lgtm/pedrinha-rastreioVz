<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTREIO DIRETO — VAI LÁ E PARA 💎🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-varredura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 94%; height: 88%;
            border: 2px solid #00ffcc;
            border-radius: 20px;
            pointer-events: none;
            z-index: 5;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 32px; height: 32px;
            border: 3px solid #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 18px #ffff00, 0 0 35px #ffcc0066, inset 0 0 10px #fff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: pulso 0.4s infinite alternate;
            transition: left 0.1s ease-out, top 0.1s ease-out;
        }
        
        .rotulo {
            position: absolute;
            background: linear-gradient(135deg, #ffff00, #ffcc00);
            color: #000; padding: 4px 10px; border-radius: 15px;
            font-weight: 900; font-size: 11px;
            pointer-events: none; display: none; z-index: 16;
            white-space: nowrap;
        }
        
        .sem-pedra {
            position: absolute;
            top: 20%; left: 50%; transform: translateX(-50%);
            padding: 8px 18px; border-radius: 20px;
            font-size: 15px; font-weight: bold;
            background: linear-gradient(135deg, #aa0000, #dd2222);
            color: #fff; border: 2px solid #ff5555;
            display: none; z-index: 20;
        }
        
        .info-topo {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px;
            border-radius: 25px; font-size: 13px; z-index: 30; text-align: center;
            max-width: 92%;
        }
        
        .dados {
            position: fixed; top: 65px; left: 50%; transform: translateX(-50%);
            background: rgba(0,25,15,0.85); color: #88ff88; padding: 6px 15px;
            border-radius: 15px; font-size: 11px; z-index: 30; text-align: center;
        }
        
        .status {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(20,30,40,0.85); color: #88ffcc; padding: 10px 20px;
            border-radius: 20px; font-size: 12px; z-index: 30; text-align: center;
        }
        
        .botoes {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 30; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }
        
        button {
            padding: 14px 28px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 50%; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        button:active { transform: scale(0.97); }
        
        #btnIniciar { background: linear-gradient(135deg, #0c0, #0f0); color: #000; font-size: 17px; padding: 15px 35px; }
        #btnParar { background: linear-gradient(135deg, #c00, #f22); color: #fff; display: none; }
        #btnReset { background: linear-gradient(135deg, #333, #555); color: #fff; display: none; }
        
        @keyframes pulso {
            from { opacity: 0.9; transform: scale(1); }
            to { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    <div class="zona-varredura"></div>
    
    <div class="marcador-pedrinha" id="bolinha"></div>
    <div class="rotulo" id="rotulo">💎 ACHOU!</div>
    <div class="sem-pedra" id="semPedra">❌ NÃO TEM</div>
    
    <div class="info-topo" id="info">🧠 RASTREIO DIRETO — VAI ONDE ESTIVER</div>
    <div class="dados" id="dados">Calibre → INICIAR → mostre os copos</div>
    <div class="status" id="status">Passo 1: Mostre a pedrinha → Passo 2: INICIAR</div>
    
    <div class="botoes">
        <button id="btnIniciar">🚀 INICIAR RASTREIO</button>
        <button id="btnParar">⏹️ PARAR</button>
        <button id="btnReset">🔄 REINICIAR</button>
    </div>

<script>
// ==========================================================
// VERSÃO FINAL — SEM ACUMULAÇÃO, SEM TRAPAÇA, SEM TRAVA
// ==========================================================
// ✅ CÁLCULO DIRETO: onde a cor aparecer, lá vai a bolinha
// ✅ SEM MÉDIA ENTRE LADOS: esquerda = esquerda, direita = direita
// ✅ ZERA TUDO AO TROCAR DE COPO: sem resto de detecção anterior
// ✅ MOSTRA A POSIÇÃO REAL: X exato, lado correto
// ==========================================================

const cam = document.getElementById('cam');
const bolinha = document.getElementById('bolinha');
const rotulo = document.getElementById('rotulo');
const semPedra = document.getElementById('semPedra');
const info = document.getElementById('info');
const dados = document.getElementById('dados');
const status = document.getElementById('status');
const btnIniciar = document.getElementById('btnIniciar');
const btnParar = document.getElementById('btnParar');
const btnReset = document.getElementById('btnReset');

let calibracao = null;
let ctx = null, canvas = null;
let ativo = false;

// === AJUSTES ===
const TOLERANCIA = 18;       // Quanto mais alto, mais sensível
const PONTOS_MINIMOS = 15;   // Quantos pontos precisa confirmar
const AMOSTRAS = 20;         // Quantos quadros por decisão

// === LIGAR CÂMERA ===
navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'environment', width: 1280, height: 720, frameRate: 30 }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = cam.videoWidth;
        canvas.height = cam.videoHeight;
        info.innerHTML = '✅ Câmera pronta — Mostre a PEDRINHA e clique INICIAR';
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === BOTÃO INICIAR ===
btnIniciar.onclick = () => {
    if (!ctx) return;
    
    status.textContent = 'Calibrando...';
    btnIniciar.disabled = true;
    btnIniciar.style.opacity = '0.6';
    
    capturarCor(() => {
        ativo = true;
        btnIniciar.style.display = 'none';
        btnParar.style.display = 'block';
        btnReset.style.display = 'block';
        info.innerHTML = '✅ PRONTO! Mostre os copos — bolinha vai direto!';
        status.textContent = 'Buscando...';
        rastrear();
    });
};

// === CAPTURAR COR DA PEDRINHA ===
function capturarCor(callback) {
    let r=0, g=0, b=0, cont=0;
    let quadros = 0;
    
    function coletar() {
        if (quadros >= 30) {
            calibracao = { r: Math.round(r/cont), g: Math.round(g/cont), b: Math.round(b/cont) };
            dados.innerHTML = `🎯 Cor: R${calibracao.r} G${calibracao.g} B${calibracao.b}`;
            callback();
            return;
        }
        
        ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const cx = canvas.width/2, cy = canvas.height/2;
        
        for (let y = cy-80; y < cy+80; y += 2) {
            for (let x = cx-80; x < cx+80; x += 2) {
                const i = (y*canvas.width + x)*4;
                const vr = img[i], vg = img[i+1], vb = img[i+2];
                if (vr > vg+25 && vr > vb+25 && vr > 80) {
                    r += vr; g += vg; b += vb; cont++;
                }
            }
        }
        
        quadros++;
        status.textContent = `Calibrando... ${quadros}/30`;
        requestAnimationFrame(coletar);
    }
    coletar();
}

// === PARAR / REINICIAR ===
btnParar.onclick = () => {
    ativo = false;
    btnParar.style.display = 'none';
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '▶️ CONTINUAR';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    esconderTudo();
};

btnReset.onclick = () => {
    ativo = false;
    calibracao = null;
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '🚀 INICIAR RASTREIO';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    btnParar.style.display = 'none';
    btnReset.style.display = 'none';
    esconderTudo();
    info.innerHTML = '🧠 Reiniciado — Mostre a pedrinha e INICIE';
    dados.innerHTML = 'Calibre → INICIAR → mostre os copos';
    status.textContent = 'Aguardando...';
};

// === VERIFICAR SE É A PEDRINHA ===
function ePedra(r, g, b) {
    if (!calibracao) return false;
    const dr = Math.abs(r - calibracao.r);
    const dg = Math.abs(g - calibracao.g);
    const db = Math.abs(b - calibracao.b);
    return dr < TOLERANCIA && dg < TOLERANCIA && db < TOLERANCIA && r > g+20 && r > b+20;
}

// === MOSTRAR BOLINHA NO LOCAL EXATO ===
function mostrar(x, y) {
    esconderTudo();
    
    const rect = cam.getBoundingClientRect();
    const posX = (x / canvas.width) * rect.width;
    const posY = (y / canvas.height) * rect.height;
    
    // Definir lado
    let lado;
    if (posX < rect.width * 0.333) lado = '⬅️ ESQUERDA';
    else if (posX < rect.width * 0.666) lado = '➡️ MEIO';
    else lado = '➡️ DIREITA';
    
    // Posicionar DIRETO — sem ajuste, sem desvio
    bolinha.style.display = 'block';
    bolinha.style.left = (posX - 16) + 'px';
    bolinha.style.top = (posY - 16) + 'px';
    
    rotulo.style.display = 'block';
    rotulo.style.left = (posX - 40) + 'px';
    rotulo.style.top = (posY - 55) + 'px';
    
    dados.innerHTML = `🎯 ${lado} | X:${Math.round(posX)}px ✅`;
    status.textContent = '✅ PEDRINHA ENCONTRADA!';
}

function mostrarNao() {
    esconderTudo();
    semPedra.style.display = 'block';
    status.textContent = '❌ NÃO TEM';
    dados.innerHTML = '🔍 Buscando...';
}

function esconderTudo() {
    bolinha.style.display = 'none';
    rotulo.style.display = 'none';
    semPedra.style.display = 'none';
}

// === CÉREBRO — LÓGICA SIMPLES E DIRETA ===
let contagem = 0;
let somaX = 0, somaY = 0, totalPontos = 0;

function rastrear() {
    if (!ativo || !ctx || !calibracao) {
        requestAnimationFrame(rastrear);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    
    // Zera para este quadro — SEM ACUMULAÇÃO ERRADA
    let pontosX = 0, pontosY = 0, qtd = 0;
    
    // VARRE TELA INTEIRA
    for (let y = 0; y < canvas.height; y += 1) {
        for (let x = 0; x < canvas.width; x += 1) {
            const i = (y * canvas.width + x) * 4;
            if (ePedra(img[i], img[i+1], img[i+2])) {
                pontosX += x;
                pontosY += y;
                qtd++;
            }
        }
    }
    
    // Se encontrou pontos, acumula para decisão
    if (qtd >= PONTOS_MINIMOS) {
        somaX += pontosX / qtd;  // centro médio deste quadro
        somaY += pontosY / qtd;
        totalPontos++;
    }
    
    contagem++;
    
    // HORA DE DECIDIR
    if (contagem >= AMOSTRAS) {
        if (totalPontos >= Math.floor(AMOSTRAS * 0.4)) {
            // CENTRO REAL — onde a média dos pontos está
            const centroX = somaX / totalPontos;
            const centroY = somaY / totalPontos;
            mostrar(centroX, centroY);
        } else {
            mostrarNao();
        }
        
        // ZERA TUDO — LIMPO PARA PRÓXIMO COPO
        setTimeout(() => {
            contagem = 0;
            somaX = 0; somaY = 0; totalPontos = 0;
            esconderTudo();
            status.textContent = 'Aponte o próximo copo...';
        }, 2500);
    } else {
        dados.innerHTML = `🔍 Varrendo... ${contagem}/${AMOSTRAS} | Pontos: ${totalPontos}`;
    }
    
    requestAnimationFrame(rastrear);
}
</script>
</body>
</html>
