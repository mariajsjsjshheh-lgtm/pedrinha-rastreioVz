<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA PEDRINHA VERMELHA — EXATA DA FOTO 💎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-busca {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 170px; height: 240px;
            border: 2px solid #ffcc00;
            border-radius: 18px;
            box-shadow: 0 0 20px #ffcc0044;
            pointer-events: none;
            z-index: 5;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 56px; height: 56px;
            border: 4px solid #ffff00;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #ffff00,
                0 0 40px #ffcc0088,
                inset 0 0 15px #ffffff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: brilho 0.4s infinite alternate;
        }
        
        .rotulo-pedrinha {
            position: absolute;
            background: #ffff00;
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 15px;
            pointer-events: none;
            display: none;
            z-index: 16;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        
        .luz-vermelha {
            position: absolute;
            top: 24%; left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #cc0000, #ee2222);
            color: #fff;
            border: 3px solid #ff6666;
            box-shadow: 0 0 18px #ff000055;
            display: none;
            z-index: 20;
        }
        
        .info-topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 30;
            text-align: center;
            border: 1px solid #ffcc0044;
        }
        
        .status-sistema {
            position: fixed;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,0,0,0.85);
            color: #ff9999;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 30;
            text-align: center;
            max-width: 90%;
        }
        
        @keyframes brilho {
            from { opacity: 0.85; transform: scale(1); }
            to { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-busca" id="zonaBusca"></div>
    
    <div class="marcador-pedrinha" id="marcadorP"></div>
    <div class="rotulo-pedrinha" id="rotuloP">💎 PEDRINHA AQUI</div>
    
    <div class="luz-vermelha" id="luzNao">❌ NÃO TEM</div>
    
    <div class="info-topo" id="infoTopo">
        🤖 PEDRINHA VERMELHA — CONFIGURADA EXATAMENTE DA FOTO
    </div>
    <div class="status-sistema" id="status">
        👁️ Pronto! Aponte devagar em cada copo...
    </div>

<script>
// ==========================================================
// AJUSTADO EXATAMENTE PARA A PEDRINHA DA FOTO
// COR CAPTURADA: VERMELHO BRILHANTE COM REFLEXOS CLAROS
// NÃO CALIBRAÇÃO MANUAL — NÃO BOTÃO — NÃO ERRO
// ==========================================================

const cam = document.getElementById('cam');
const zonaBusca = document.getElementById('zonaBusca');
const marcadorP = document.getElementById('marcadorP');
const rotuloP = document.getElementById('rotuloP');
const luzNao = document.getElementById('luzNao');
const infoTopo = document.getElementById('infoTopo');
const status = document.getElementById('status');

let ctx = null, quadro = null;

// ==========================================================
// COR EXATA DA PEDRINHA QUE VOCÊ MOSTROU
// Vermelho brilhante R:220-250 | G:30-80 | B:30-80
// Com tolerância pros reflexos brancos/brilhantes
// ==========================================================
const MIN_R = 200, MAX_R = 255;
const MIN_G = 25, MAX_G = 90;
const MIN_B = 25, MAX_B = 90;

// Reflexos brilhantes da pedrinha (claros)
const REFLEXO_R = 200, REFLEXO_G = 150, REFLEXO_B = 150;
const TOL_REFLEXO = 60;

const MIN_PONTOS = 12;        // Mais sensível = pega pedrinha pequena
const MIN_CONFIRMA = 6;
const AMOSTRAS_DECISAO = 30;  // Mais rápido na resposta

// === INICIAR DIRETO ===
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        analisar();
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === DETECÇÃO EXATA DA PEDRINHA DA FOTO ===
function ehPedrinha(r, g, b) {
    // Cor principal: vermelho forte
    const corPrincipal = 
        r >= MIN_R && r <= MAX_R &&
        g >= MIN_G && g <= MAX_G &&
        b >= MIN_B && b <= MAX_B &&
        r > g + 40 && r > b + 40; // Vermelho é MUITO mais forte
    
    // Reflexo brilhante/claro em cima da pedrinha
    const reflexo = 
        Math.abs(r - REFLEXO_R) < TOL_REFLEXO &&
        Math.abs(g - REFLEXO_G) < TOL_REFLEXO &&
        Math.abs(b - REFLEXO_B) < TOL_REFLEXO &&
        r > g + 30; // Predomina tom vermelho/claro
    
    return corPrincipal || reflexo;
}

// === MOSTRA PEDRINHA MARCADA ===
function mostrarPedrinha(x, y) {
    esconderTudo();
    
    const rectCam = cam.getBoundingClientRect();
    const tx = (x / quadro.width) * rectCam.width;
    const ty = (y / quadro.height) * rectCam.height;
    
    marcadorP.style.display = 'block';
    marcadorP.style.left = (tx - 28) + 'px';
    marcadorP.style.top = (ty - 28) + 'px';
    
    rotuloP.style.display = 'block';
    rotuloP.style.left = (tx - 60) + 'px';
    rotuloP.style.top = (ty - 80) + 'px';
    
    status.textContent = '🎯 PEDRINHA DETECTADA — veja marcada acima!';
}

// === LUZ VERMELHA PEQUENA ===
function mostrarNaoTem() {
    esconderTudo();
    luzNao.style.display = 'block';
    status.textContent = '❌ NÃO TEM — prossiga';
}

function esconderTudo() {
    marcadorP.style.display = 'none';
    rotuloP.style.display = 'none';
    luzNao.style.display = 'none';
}

// === CONTROLE DE DECISÃO ===
let analise = {
    positivos: 0,
    total: 0,
    decidido: false,
    somaX: 0,
    somaY: 0,
    qtdPontos: 0
};

// === ANÁLISE PRINCIPAL — RODA SEM PARAR ===
function analisar() {
    if (!ctx) {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    // Área focada
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaBusca.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    let encontrados = 0;
    let somaX = 0, somaY = 0;
    
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                encontrados++;
                somaX += x;
                somaY += y;
            }
        }
    }
    
    if (!analise.decidido) {
        analise.total++;
        
        if (encontrados >= MIN_PONTOS) {
            analise.positivos++;
            analise.somaX += somaX;
            analise.somaY += somaY;
            analise.qtdPontos += encontrados;
        }
        
        if (analise.total >= AMOSTRAS_DECISAO) {
            const confiavel = analise.positivos / analise.total >= 0.25 &&
                             analise.positivos >= MIN_CONFIRMA;
            
            if (confiavel) {
                const cx = analise.somaX / analise.qtdPontos;
                const cy = analise.somaY / analise.qtdPontos;
                mostrarPedrinha(cx, cy);
            } else {
                mostrarNaoTem();
            }
            
            analise.decidido = true;
            
            // Reinicia sozinho
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false, somaX: 0, somaY: 0, qtdPontos: 0 };
                esconderTudo();
                status.textContent = 'Aponte para o próximo copo...';
            }, 2500);
        } else {
            status.textContent = `Analisando... ${analise.total}/${AMOSTRAS_DECISAO} | Detecções: ${analise.positivos}`;
        }
    }
    
    requestAnimationFrame(analisar);
}
</script>
</body>
</html>
