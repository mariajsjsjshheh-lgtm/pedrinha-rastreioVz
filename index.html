<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA RASTREIO LIVRE — VAI DIRETO NO ALVO 💎🎯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #000; height: 100vh; }
        
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        .zona-varredura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; height: 85%;
            border: 2px solid #00ffcc;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ffcc44;
            pointer-events: none;
            z-index: 5;
        }
        
        .marcador-pedrinha {
            position: absolute;
            width: 32px; height: 32px;
            border: 3px solid #ffff00;
            border-radius: 50%;
            box-shadow: 
                0 0 18px #ffff00,
                0 0 35px #ffcc0066,
                inset 0 0 10px #ffffff;
            pointer-events: none;
            display: none;
            z-index: 15;
            animation: pulso-forte 0.4s infinite alternate;
            transition: left 0.1s ease-out, top 0.1s ease-out;
            will-change: left, top;
        }
        
        .rotulo-pedrinha {
            position: absolute;
            background: linear-gradient(135deg, #ffff00, #ffcc00);
            color: #000;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 11px;
            pointer-events: none;
            display: none;
            z-index: 16;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        
        .luz-vermelha {
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #aa0000, #dd2222);
            color: #fff;
            border: 2px solid #ff5555;
            box-shadow: 0 0 15px #ff000044;
            display: none;
            z-index: 20;
        }
        
        .info-topo {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 30;
            text-align: center;
            border: 1px solid #00ffcc44;
            max-width: 92%;
        }
        
        .status-sistema {
            position: fixed;
            bottom: 90px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20,30,40,0.85);
            color: #88ffcc;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 30;
            text-align: center;
            max-width: 90%;
            border: 1px solid #00ffcc33;
        }
        
        .botoes {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }
        
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.15s;
        }
        button:active { transform: scale(0.97); }
        
        #btnIniciar { 
            background: linear-gradient(135deg, #00cc00, #00ff00); 
            color: #000; 
            font-size: 17px;
            padding: 15px 35px;
        }
        #btnParar { 
            background: linear-gradient(135deg, #cc0000, #ff2222); 
            color: #fff; 
            display: none;
        }
        #btnReset { 
            background: linear-gradient(135deg, #333, #555); 
            color: #fff; 
            display: none;
        }
        
        .posicao-alvo {
            position: fixed;
            top: 65px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,25,15,0.85);
            color: #88ff88;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 30;
            border: 1px solid #00ff0033;
            text-align: center;
            max-width: 95%;
        }
        
        @keyframes pulso-forte {
            from { opacity: 0.9; transform: scale(1); }
            to { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline></video>
    
    <div class="zona-varredura" id="zonaVarredura"></div>
    
    <div class="marcador-pedrinha" id="marcadorP"></div>
    <div class="rotulo-pedrinha" id="rotuloP">💎 ACHOU!</div>
    
    <div class="luz-vermelha" id="luzNao">❌ NÃO TEM</div>
    
    <div class="info-topo" id="infoTopo">
        🧠 RASTREIO LIVRE — SEM TRAVA NO MEIO → VAI DIRETO NO ALVO
    </div>
    <div class="posicao-alvo" id="posicaoAlvo">
        Sistema pronto — calibre e inicie
    </div>
    <div class="status-sistema" id="status">
        👁️ Passo 1: Mostre a pedrinha → Passo 2: INICIAR
    </div>
    
    <div class="botoes">
        <button id="btnIniciar">🚀 INICIAR RASTREIO</button>
        <button id="btnParar">⏹️ PARAR</button>
        <button id="btnReset">🔄 REINICIAR</button>
    </div>

<script>
// ==========================================================
// RASTREIO LIVRE — SEM NENHUMA TRAVA NO MEIO
// ==========================================================
// ✅ REMOVIDO TUDO QUE PRENDIA NO CENTRO DA TELA
// ✅ BOLINHA VAI EXATAMENTE ONDE ESTIVER A PEDRINHA
// ✅ ESQUERDA, MEIO, DIREITA — QUALQUER POSIÇÃO
// ✅ CENTRO DE MASSA PURO — APENAS OS PONTOS DETECTADOS DEFINEM O LOCAL
// ✅ SEM MÉDIA FORÇADA, SEM AJUSTE FALSO, SEM TRAVA
// ==========================================================

const cam = document.getElementById('cam');
const zonaVarredura = document.getElementById('zonaVarredura');
const marcadorP = document.getElementById('marcadorP');
const rotuloP = document.getElementById('rotuloP');
const luzNao = document.getElementById('luzNao');
const infoTopo = document.getElementById('infoTopo');
const posicaoAlvo = document.getElementById('posicaoAlvo');
const status = document.getElementById('status');
const btnIniciar = document.getElementById('btnIniciar');
const btnParar = document.getElementById('btnParar');
const btnReset = document.getElementById('btnReset');

let fase = 'calibracao';
let assinatura = null;
let ctx = null, quadro = null;
let rastreioAtivo = false;

// === PARÂMETROS OTIMIZADOS ===
const TOL_RIGIDA = 12;
const TOL_MEDIA = 18;
const TOL_FLEX = 24;
const MIN_PONTOS = 8;
const MIN_CONFIRMA = 4;
const AMOSTRAS_DECISAO = 25;

// === INICIAR CÂMERA ===
navigator.mediaDevices.getUserMedia({ 
    video: { 
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
    }
}).then(stream => {
    cam.srcObject = stream;
    cam.onloadedmetadata = () => {
        quadro = document.createElement('canvas');
        ctx = quadro.getContext('2d', { willReadFrequently: true });
        quadro.width = cam.videoWidth;
        quadro.height = cam.videoHeight;
        infoTopo.innerHTML = '✅ Câmera pronta — Mostre a PEDRINHA e clique INICIAR';
    };
}).catch(() => alert('Dê permissão à câmera! 📷'));

// === BOTÃO INICIAR ===
btnIniciar.onclick = () => {
    if (!ctx) return;
    
    if (fase === 'calibracao') {
        infoTopo.innerHTML = '📸 Capturando identidade... Mantenha a pedrinha visível';
        status.textContent = 'Analisando cor...';
        btnIniciar.disabled = true;
        btnIniciar.style.opacity = '0.7';
        
        calibraCorPedrinha(() => {
            fase = 'pronto';
            rastreioAtivo = true;
            btnIniciar.style.display = 'none';
            btnParar.style.display = 'block';
            btnReset.style.display = 'block';
            infoTopo.innerHTML = '✅ LIVRE! Mostre os 3 copos — bolinha vai direto no que tem!';
            status.textContent = 'Rastreando sem trava...';
            analisar();
        });
    }
};

// === CALIBRAÇÃO ===
function calibraCorPedrinha(callback) {
    let rAcum = [], gAcum = [], bAcum = [];
    let quadros = 0;
    const total = 50;
    
    function coletar() {
        if (quadros >= total) {
            const r = Math.round(media(rAcum));
            const g = Math.round(media(gAcum));
            const b = Math.round(media(bAcum));
            
            assinatura = { r, g, b, confirmada: true };
            posicaoAlvo.innerHTML = `🎯 Cor: R${r} G${g} B${b} | Rastreio LIVRE ativado`;
            callback();
            return;
        }
        
        ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
        const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
        
        let sr = 0, sg = 0, sb = 0, n = 0;
        
        for (let y = quadro.height * 0.25; y < quadro.height * 0.75; y += 2) {
            for (let x = quadro.width * 0.25; x < quadro.width * 0.75; x += 2) {
                const i = (y * quadro.width + x) * 4;
                const r = dados[i], g = dados[i+1], b = dados[i+2];
                
                if (r > g + 30 && r > b + 30 && r > 80) {
                    sr += r; sg += g; sb += b; n++;
                }
            }
        }
        
        if (n > 0) {
            rAcum.push(sr / n);
            gAcum.push(sg / n);
            bAcum.push(sb / n);
        }
        
        quadros++;
        status.textContent = `Calibrando... ${quadros}/${total}`;
        requestAnimationFrame(coletar);
    }
    
    coletar();
}

function media(arr) {
    return arr.reduce((a,b) => a + b, 0) / arr.length;
}

// === PARAR / REINICIAR ===
btnParar.onclick = () => {
    rastreioAtivo = false;
    btnParar.style.display = 'none';
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '▶️ CONTINUAR';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    infoTopo.innerHTML = '⏸️ Pausado';
    status.textContent = 'Rastreio pausado';
    esconderTudo();
};

btnReset.onclick = () => {
    fase = 'calibracao';
    rastreioAtivo = false;
    assinatura = null;
    btnIniciar.style.display = 'block';
    btnIniciar.textContent = '🚀 INICIAR RASTREIO';
    btnIniciar.disabled = false;
    btnIniciar.style.opacity = '1';
    btnParar.style.display = 'none';
    btnReset.style.display = 'none';
    esconderTudo();
    infoTopo.innerHTML = '🧠 Reiniciado — Mostre a pedrinha e INICIE';
    posicaoAlvo.innerHTML = 'Sistema pronto — calibre e inicie';
    status.textContent = 'Aguardando...';
};

// === DETECÇÃO DE COR ===
function ehPedrinha(r, g, b) {
    if (!assinatura) return false;
    
    const dr = Math.abs(r - assinatura.r);
    const dg = Math.abs(g - assinatura.g);
    const db = Math.abs(b - assinatura.b);
    
    const exata = dr < TOL_RIGIDA && dg < TOL_RIGIDA && db < TOL_RIGIDA;
    const parcial = dr < TOL_MEDIA && dg < TOL_MEDIA && db < TOL_MEDIA;
    const reflexo = dr < TOL_FLEX && dg < TOL_FLEX && db < TOL_FLEX && r > assinatura.r * 0.85;
    
    let predominante = (assinatura.r > assinatura.g + 20 && assinatura.r > assinatura.b + 20)
        ? (r > g + 25 && r > b + 25)
        : (assinatura.g > assinatura.r + 20 && assinatura.g > assinatura.b + 20)
            ? (g > r + 25 && g > b + 25)
            : true;
    
    return ((exata || parcial || reflexo) && predominante);
}

// === BOLINHA VAI EXATAMENTE NO LOCAL — SEM TRAVA ===
function mostrarPedrinha(x, y) {
    esconderTudo();
    
    const rectCam = cam.getBoundingClientRect();
    const tx = (x / quadro.width) * rectCam.width;
    const ty = (y / quadro.height) * rectCam.height;
    
    // SEM AJUSTE, SEM TRAVA, SEM DESVIO — DIRETO NO PONTO REAL
    marcadorP.style.display = 'block';
    marcadorP.style.left = (tx - 16) + 'px';
    marcadorP.style.top = (ty - 16) + 'px';
    
    rotuloP.style.display = 'block';
    rotuloP.style.left = (tx - 40) + 'px';
    rotuloP.style.top = (ty - 55) + 'px';
    
    // MOSTRA EM QUAL LADO FICOU
    let lado = '';
    if (tx < rectCam.width * 0.33) lado = '⬅️ ESQUERDA';
    else if (tx < rectCam.width * 0.66) lado = '➡️ MEIO';
    else lado = '➡️ DIREITA';
    
    posicaoAlvo.innerHTML = `🎯 ${lado} | X:${Math.round(x)} Y:${Math.round(y)} | Alvo fixado`;
    status.textContent = '✅ PEDRINHA LOCALIZADA — bolinha em cima do copo!';
}

function mostrarNaoTem() {
    esconderTudo();
    luzNao.style.display = 'block';
    status.textContent = '❌ NÃO TEM — prossiga';
    posicaoAlvo.innerHTML = '🔍 Buscando próximo...';
}

function esconderTudo() {
    marcadorP.style.display = 'none';
    rotuloP.style.display = 'none';
    luzNao.style.display = 'none';
}

// === CÉREBRO — PURO CENTRO DE MASSA, SEM NENHUMA TRAVA ===
let analise = {
    positivos: 0,
    total: 0,
    decidido: false,
    somaX: 0,
    somaY: 0,
    qtdPontos: 0
};

function analisar() {
    if (!rastreioAtivo || !ctx || !assinatura) {
        requestAnimationFrame(analisar);
        return;
    }
    
    ctx.drawImage(cam, 0, 0, quadro.width, quadro.height);
    const dados = ctx.getImageData(0, 0, quadro.width, quadro.height).data;
    
    const rectCam = cam.getBoundingClientRect();
    const zRect = zonaVarredura.getBoundingClientRect();
    
    const escalaW = quadro.width / rectCam.width;
    const escalaH = quadro.height / rectCam.height;
    
    const areaX = Math.floor((zRect.left - rectCam.left) * escalaW);
    const areaY = Math.floor((zRect.top - rectCam.top) * escalaH);
    const areaL = Math.floor(zRect.width * escalaW);
    const areaA = Math.floor(zRect.height * escalaH);
    
    const minX = Math.max(0, areaX);
    const maxX = Math.min(quadro.width, areaX + areaL);
    const minY = Math.max(0, areaY);
    const maxY = Math.min(quadro.height, areaY + areaA);
    
    // VARRE TUDO — PEGA TODOS OS PONTOS DA PEDRINHA
    let encontrados = 0;
    let somaX = 0, somaY = 0;
    
    for (let y = minY; y < maxY; y += 1) {
        for (let x = minX; x < maxX; x += 1) {
            const i = (y * quadro.width + x) * 4;
            if (ehPedrinha(dados[i], dados[i+1], dados[i+2])) {
                encontrados++;
                somaX += x;  // ACUMULA A POSIÇÃO REAL
                somaY += y;  // SEM DESVIO, SEM AJUSTE FORÇADO
            }
        }
    }
    
    if (!analise.decidido) {
        analise.total++;
        
        if (encontrados >= MIN_PONTOS) {
            analise.positivos++;
            analise.somaX += somaX;
            analise.somaY += somaY;
            analise.qtdPontos += encontrados;
        }
        
        if (analise.total >= AMOSTRAS_DECISAO) {
            const confiavel = analise.positivos / analise.total >= 0.28 &&
                             analise.positivos >= MIN_CONFIRMA;
            
            if (confiavel) {
                // CENTRO REAL — MÉDIA DOS PONTOS DETECTADOS APENAS
                // NÃO É CENTRO DA TELA, É ONDE A PEDRINHA ESTÁ
                const centroX = analise.somaX / analise.qtdPontos;
                const centroY = analise.somaY / analise.qtdPontos;
                mostrarPedrinha(centroX, centroY);
            } else {
                mostrarNaoTem();
            }
            
            analise.decidido = true;
            
            // LIBERA PARA PRÓXIMO
            setTimeout(() => {
                analise = { positivos: 0, total: 0, decidido: false, somaX: 0, somaY: 0, qtdPontos: 0 };
                esconderTudo();
                status.textContent = 'Aponte para o próximo copo...';
            }, 2500);
        } else {
            posicaoAlvo.innerHTML = `🔍 Varrendo... ${analise.total}/${AMOSTRAS_DECISAO} | Pontos: ${analise.positivos}`;
        }
    }
    
    requestAnimationFrame(analisar);
}
</script>
</body>
</html>
